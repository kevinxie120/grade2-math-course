  <div class="shell"><header class="topbar" aria-label="课程工具栏"><div class="brand">⚖️ 公平分配探险队</div><div class="track"><div id="progress-bar" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div><div class="tools"><button id="speech-button" class="tool" type="button" aria-label="朗读当前内容" aria-pressed="false">🔊<span class="label"> 朗读</span></button><button id="pause-button" class="tool" type="button" aria-label="暂停并返回首页" hidden>⏸️<span class="label"> 暂停</span></button></div></header><main id="app"></main><div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div></div>
<script>
'use strict';
/* TESTABLE_CORE_START */
const PHASES={fairShare:{title:'公平分配码头',minutes:10},shareTypes:{title:'两种分法营地',minutes:12},notation:{title:'除法算式桥',minutes:10},facts:{title:'口诀求商山道',minutes:10},family:{title:'乘除关系屋',minutes:8},application:{title:'生活应用村',minutes:10},break:{title:'补给休息站',minutes:0}};
const EXPLORATIONS=[
 {id:'explore-fair-plates',phase:'fairShare',type:'plates',title:'把12颗星星公平放进3个盘子',instruction:'依次点击星星，轮流放进3个盘子。',success:'每个盘子都是4颗，才叫平均分。'},
 {id:'explore-share-count',phase:'shareTypes',type:'bags',title:'12块饼干分成4袋',instruction:'观察4袋各有几块。',success:'分成4份，每份3块：12 ÷ 4 = 3。'},
 {id:'explore-group-size',phase:'shareTypes',type:'bags',title:'12块饼干每袋装3块',instruction:'数一数能装成几袋。',success:'每份3块，能装4份：12 ÷ 3 = 4。'},
 {id:'explore-equation-cards',phase:'notation',type:'cards',title:'给分盘图配除法算式',instruction:'点击“12 ÷ 3 = 4”这张卡。',success:'总数 ÷ 份数 = 每份数。'},
 {id:'explore-fact-chant',phase:'facts',type:'cards',title:'用口诀找12 ÷ 3的商',instruction:'点击“三四十二”。',success:'三四十二，所以12 ÷ 3 = 4。'},
 {id:'explore-check-multiply',phase:'facts',type:'cards',title:'用乘法检查除法',instruction:'点击“4 × 3 = 12”。',success:'商 × 除数 = 被除数，答案检查对了。'},
 {id:'explore-family-house',phase:'family',type:'cards',title:'搭建3、4、12的关系屋',instruction:'把4张关系卡都点亮。',success:'同一组数能组成两道乘法和两道除法。'},
 {id:'explore-reverse-story',phase:'family',type:'cards',title:'分法故事变一变',instruction:'点击“12 ÷ 4 = 3”。',success:'同样的12个，可以按4份分，也可以每份4个。'},
 {id:'explore-seat-plan',phase:'application',type:'plates',title:'12名同学坐3排',instruction:'点击排座按钮，看看每排几人。',success:'12人平均坐3排，每排4人。'}
];
function q(id,phase,dimension,objective,prompt,expression,answer,options,hints,explanation,rules=[],tags=['平均分']){return{id,phase,dimension,objective,type:'choice',prompt,expression,answer,options,hints,explanation,misconceptionRules:rules,tags};}
const H=(a,b,c)=>[a,b,c];
const QUESTION_BANK=[
 q('fair-01','fairShare','meaning','fair-share','12个苹果平均放进3个盘子，每盘几个？','12 ÷ 3 = ?',4,[3,4,6,9],H('先看总数和盘子数。','画3个盘子，12个轮流放。','每盘4个：12 ÷ 3 = 4。'),'平均分时每盘一样多。',[{code:'only-quotient-no-context',answers:[3]}]),
 q('fair-02','fairShare','meaning','fair-judge','下面哪一种分法是公平分？','12个球分3份', '每份4个',['第一份5个，第二份4个，第三份3个','每份4个','第一份6个，第二份3个，第三份3个','第一份2个，第二份5个，第三份5个'],H('比较每一份是否一样多。','12分3份，每份应是4。','每份都是4个，才是公平分。'),'公平分要求每一份同样多。'),
 q('fair-03','fairShare','meaning','fair-share','15支铅笔平均分给5人，每人几支？','15 ÷ 5 = ?',3,[2,3,5,10],H('先看分给几人。','5人各拿相同数量。','15 ÷ 5 = 3，每人3支。'),'15支平均给5人，每人3支。',[{code:'swapped-total-and-groups',answers:[5]}]),
 q('model-01','shareTypes','meaning','share-types','12颗糖每袋装3颗，可以装几袋？','12 ÷ 3 = ?',4,[3,4,9,12],H('这次知道的是每袋几个。','每袋3颗，圈出一组又一组。','12里面有4个3，所以12 ÷ 3 = 4。'),'问能装几袋，是按每份数分。',[{code:'each-size-as-group-count',answers:[3]}]),
 q('model-02','shareTypes','meaning','share-types','12颗糖平均装进4袋，每袋几颗？','12 ÷ 4 = ?',3,[3,4,8,16],H('这次知道的是袋子数。','画4个袋子，轮流装糖。','12平均分4袋，每袋3颗。'),'问每袋几颗，是分成几份。',[{code:'each-size-as-group-count',answers:[4]}]),
 q('model-03','shareTypes','meaning','share-types','“18本书，每3本一摞”是在问什么？','18 ÷ 3','能分成几摞',['每摞几本','能分成几摞','一共有几本','还差几本'],H('找一找已知的是每份几个。','每3本是一摞，继续圈组。','已知每份3本，问题是有几摞。'),'每份数已知时，商表示份数。'),
 q('model-04','shareTypes','model','share-types','哪张图表示“12 ÷ 3 = 4”？','12 ÷ 3 = 4','3份，每份4个',['4份，每份3个','3份，每份4个','12份，每份3个','3份，每份12个'],H('除数3表示分成几份。','画3个盘子，12个物品平均放。','3份每份4个，写作12 ÷ 3 = 4。'),'图和算式都要写清“几份、每份几”。',[{code:'swapped-total-and-groups',answers:['4份，每份3个']}]),
 q('notation-01','notation','model','division-symbol','16朵花平均插进4个瓶子，选对的算式。','?', '16 ÷ 4 = 4',['16 + 4 = 20','16 × 4 = 64','16 ÷ 4 = 4','4 ÷ 16 = 4'],H('平均分要用除法。','总数16，瓶子4个。','16 ÷ 4 = 4。'),'平均分用除号连接总数、份数和每份数。',[{code:'multiplication-instead-of-division',answers:['16 × 4 = 64']},{code:'swapped-total-and-groups',answers:['4 ÷ 16 = 4']}]),
 q('notation-02','notation','model','division-symbol','18个气球，每6个扎一束，共几束？','18 ÷ 6 = ?',3,[2,3,6,12],H('每束6个，问有几束。','从18里每次拿走6个。','18里面有3个6，所以商是3。'),'按每份数分组，商表示组数。',[{code:'each-size-as-group-count',answers:[6]}]),
 q('notation-03','notation','model','division-parts','在“20 ÷ 5 = 4”里，被除数是哪个数？','20 ÷ 5 = 4',20,[4,5,20,25],H('被除数是要平均分的总数。','先找除号左边的数。','20是总数，所以20是被除数。'),'被除数是被平均分的总数。'),
 q('notation-04','notation','model','division-parts','在“20 ÷ 5 = 4”里，商表示什么？','20 ÷ 5 = 4','每份4个',['总共20个','分成5份','每份4个','多了1个'],H('商是除号后面得到的数。','20平均分5份得到4。','商4表示每份4个。'),'商要放回情境解释。',[{code:'only-quotient-no-context',answers:['分成5份']}]),
 q('fact-01','facts','relation','fact-division','用哪句口诀算12 ÷ 3？','12 ÷ 3 = ?','三四十二',['三四十二','二六十二','四五二十','三五十五'],H('找“几和3相乘得12”。','3 × 4 = 12。','三四十二，所以12 ÷ 3 = 4。'),'用“除数×商=被除数”找口诀。'),
 q('fact-02','facts','relation','fact-division','24 ÷ 6 = ?','24 ÷ 6 = ?',4,[3,4,5,6],H('想6和几相乘得24。','四六二十四。','24 ÷ 6 = 4。'),'四六二十四能求24除以6。',[{code:'each-size-as-group-count',answers:[6]}]),
 q('fact-03','facts','relation','fact-division','35 ÷ 5 = ?','35 ÷ 5 = ?',7,[5,6,7,8],H('想5和几相乘得35。','五七三十五。','35 ÷ 5 = 7。'),'五七三十五，商是7。'),
 q('fact-04','facts','relation','fact-division','42 ÷ 7 = ?','42 ÷ 7 = ?',6,[5,6,7,8],H('想7和几相乘得42。','六七四十二。','42 ÷ 7 = 6。'),'六七四十二，商是6。'),
 q('fact-05','facts','relation','check-division','“32 ÷ 4 = 8”怎样检查？','?', '8 × 4 = 32',['32 + 4 = 36','8 × 4 = 32','32 - 4 = 28','4 ÷ 8 = 2'],H('除法可以用相反的乘法检查。','商8和除数4相乘。','8 × 4 = 32，和被除数相同。'),'商乘除数等于被除数，说明算对。'),
 q('relation-01','family','relation','fact-family','3、4、12能组成哪组乘除算式？','关系屋','3 × 4 = 12；12 ÷ 3 = 4',['3 + 4 = 12；12 - 3 = 4','3 × 4 = 12；12 ÷ 3 = 4','3 × 12 = 4；4 ÷ 3 = 12','12 × 3 = 4；12 ÷ 4 = 3'],H('三个数要互相对应。','先写3×4=12，再倒过来写除法。','3 × 4 = 12，所以12 ÷ 3 = 4。'),'同一组数可以写乘法和对应除法。'),
 q('relation-02','family','application','story-meaning','“18人每6人一队，分成3队”对应哪个算式？','?', '18 ÷ 6 = 3',['18 ÷ 3 = 6','18 ÷ 6 = 3','18 × 6 = 108','6 ÷ 3 = 2'],H('每队6人，问队数。','18里每6人圈一队。','18 ÷ 6 = 3，能分3队。'),'每份数是6，商是队数。',[{code:'swapped-total-and-groups',answers:['18 ÷ 3 = 6']}]),
 q('app-01','application','application','application-solve','24块积木平均分给6个孩子，每人几块？','24 ÷ 6 = ?',4,[3,4,5,6],H('先找总数和人数。','画6个孩子，24块轮流分。','24 ÷ 6 = 4，每人4块。'),'平均分给6人，商表示每人几个。'),
 q('app-02','application','application','application-solve','20个座位，每排坐5人，可以坐几排？','20 ÷ 5 = ?',4,[4,5,10,15],H('每排5人，问排数。','20里面有几个5。','20 ÷ 5 = 4，可以坐4排。'),'按每排人数分组，商表示排数。'),
 q('app-03','application','application','application-solve','30元买6支同样的笔，每支几元？','30 ÷ 6 = ?',5,[4,5,6,24],H('总钱数平均分给6支笔。','想6和几相乘得30。','五六三十，所以每支5元。'),'单价相同，用总价除数量。'),
 q('app-04','application','application','application-check','16个橘子装进4个篮子，每篮4个。小明写16 ÷ 4 = 5，哪里不对？','16 ÷ 4 = 5','商应该是4',['除号写错了','商应该是4','总数应该是5','不需要算式'],H('用乘法检查小明的商。','5 × 4 = 20，不是16。','4 × 4 = 16，所以商应是4。'),'商乘除数要回到原来的总数。',[{code:'only-quotient-no-context',answers:['除号写错了']}])
];
function positive(value){if(!Number.isInteger(value)||value<=0)throw new Error('必须是正整数');}
function fairShare(total,groups){positive(total);positive(groups);if(total%groups)throw new Error('不能平均分');return Array(groups).fill(total/groups);}
function groupBySize(total,size){positive(total);positive(size);if(total%size)throw new Error('不能平均分');return total/size;}
function factFamily(a,b){positive(a);positive(b);const total=a*b;return[`${a} × ${b} = ${total}`,`${b} × ${a} = ${total}`,`${total} ÷ ${a} = ${b}`,`${total} ÷ ${b} = ${a}`];}
function norm(value){return String(value??'').trim().replace(/\s+/g,' ');}
function evaluateAnswer(question,answer){return norm(answer)!==''&&norm(question.answer)===norm(answer);}
function getHint(question,level){const safe=Math.max(1,Math.min(3,Number(level)||1));return{level:safe,text:question.hints[safe-1]};}
function detectMisconception(question,answer){const found=(question.misconceptionRules||[]).find(rule=>rule.answers.some(value=>norm(value)===norm(answer)));return found?found.code:null;}
function buildActivityQueue(){return[
 {kind:'exploration',id:'explore-fair-plates',phase:'fairShare'},...QUESTION_BANK.filter(x=>x.phase==='fairShare').map(x=>({kind:'question',id:x.id,phase:x.phase})),
 ...EXPLORATIONS.filter(x=>x.phase==='shareTypes').map(x=>({kind:'exploration',id:x.id,phase:x.phase})),...QUESTION_BANK.filter(x=>x.phase==='shareTypes').map(x=>({kind:'question',id:x.id,phase:x.phase})),
 ...EXPLORATIONS.filter(x=>x.phase==='notation').map(x=>({kind:'exploration',id:x.id,phase:x.phase})),...QUESTION_BANK.filter(x=>x.phase==='notation').map(x=>({kind:'question',id:x.id,phase:x.phase})),
 {kind:'break',id:'mid-course-break',phase:'break'},
 ...EXPLORATIONS.filter(x=>x.phase==='facts').map(x=>({kind:'exploration',id:x.id,phase:x.phase})),...QUESTION_BANK.filter(x=>x.phase==='facts').map(x=>({kind:'question',id:x.id,phase:x.phase})),
 ...EXPLORATIONS.filter(x=>x.phase==='family').map(x=>({kind:'exploration',id:x.id,phase:x.phase})),...QUESTION_BANK.filter(x=>x.phase==='family').map(x=>({kind:'question',id:x.id,phase:x.phase})),
 ...EXPLORATIONS.filter(x=>x.phase==='application').map(x=>({kind:'exploration',id:x.id,phase:x.phase})),...QUESTION_BANK.filter(x=>x.phase==='application').map(x=>({kind:'question',id:x.id,phase:x.phase}))];}
const SAVE_KEY='mathQuest.grade2.unit6.v1';
function createInitialState(){return{version:1,status:'home',screen:'home',activityIndex:0,records:[],completedExplorations:[],breakCompleted:false,current:{selectedAnswer:null,maxHintLevel:0,attempts:0,lastMisconception:null,explorationStep:0},mode:'learn',retryQueue:[],retryIndex:0,retryResults:[]};}
function validRecord(record){return record&&typeof record.questionId==='string'&&QUESTION_BANK.some(q=>q.id===record.questionId)&&typeof record.firstCorrect==='boolean'&&Number.isInteger(record.firstHintLevel)&&record.firstHintLevel>=0&&record.firstHintLevel<=3&&Number.isInteger(record.attempts)&&record.attempts>=1&&Number.isInteger(record.maxHintLevel)&&record.maxHintLevel>=0&&record.maxHintLevel<=3&&typeof record.resolved==='boolean';}
function validateSave(value){if(!value||value.version!==1||!['home','learning','completed','retry'].includes(value.status)||!Number.isInteger(value.activityIndex)||value.activityIndex<0||value.activityIndex>buildActivityQueue().length||!Array.isArray(value.records)||!Array.isArray(value.completedExplorations))return null;if(value.records.some(x=>!validRecord(x)))return null;const ids=value.records.map(x=>x.questionId);if(new Set(ids).size!==ids.length)return null;if(value.completedExplorations.some(id=>!EXPLORATIONS.some(x=>x.id===id)))return null;if(value.status==='completed'&&ids.length!==QUESTION_BANK.length)return null;return value;}
function buildReport(records,bank=QUESTION_BANK,retryResults=[]){const dimensions={meaning:{independent:0,supported:0,needsPractice:0},model:{independent:0,supported:0,needsPractice:0},relation:{independent:0,supported:0,needsPractice:0},application:{independent:0,supported:0,needsPractice:0}};const misconceptions={};let independent=0,supported=0,hinted=0;for(const record of records){const bucket=dimensions[record.dimension]||dimensions.meaning;if(record.firstCorrect&&record.firstHintLevel===0){independent++;bucket.independent++;}else if(record.firstCorrect){supported++;bucket.supported++;}else bucket.needsPractice++;if(record.maxHintLevel>0)hinted++;if(record.firstMisconception)misconceptions[record.firstMisconception]=(misconceptions[record.firstMisconception]||0)+1;}const unansweredIds=bank.filter(q=>!records.some(r=>r.questionId===q.id)).map(q=>q.id);const strengths=Object.entries(dimensions).filter(([,v])=>v.independent+v.supported>0).map(([key])=>`${({meaning:'除法含义',model:'分物模型',relation:'口诀与乘除关系',application:'生活应用'})[key]}有可靠证据`);const needs=Object.entries(dimensions).filter(([,v])=>v.needsPractice>0).map(([key])=>`再用${({meaning:'分盘',model:'圈组',relation:'口诀检查',application:'生活故事'})[key]}练一练`);return{completed:records.length,unanswered:unansweredIds.length,unansweredIds,independentFirstCorrect:independent,supportedFirstCorrect:supported,dimensions,misconceptions,hintUsage:{questions:hinted},retry:{attempted:retryResults.length,correct:retryResults.filter(x=>x.correct).length},strengths:strengths.length?strengths:['完成更多题目后会看到优势'],nextSteps:needs.length?needs:['继续完成尚未作答的题目']};}
window.DivisionAdventureTestHooks={PHASES,EXPLORATIONS,QUESTION_BANK,fairShare,groupBySize,factFamily,evaluateAnswer,getHint,detectMisconception,buildActivityQueue,buildReport,createInitialState,validateSave};
/* TESTABLE_CORE_END */
const app=document.querySelector('#app'),live=document.querySelector('#live-region'),progress=document.querySelector('#progress-bar'),speechButton=document.querySelector('#speech-button'),pauseButton=document.querySelector('#pause-button');
let state=loadState(),dialog=null;function clone(x){return JSON.parse(JSON.stringify(x));}function loadState(){try{return validateSave(JSON.parse(localStorage.getItem(SAVE_KEY)))||createInitialState();}catch{return createInitialState();}}function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));}function announce(text){live.textContent='';setTimeout(()=>live.textContent=text,0);}function currentActivity(){if(state.mode==='retry')return state.retryQueue[state.retryIndex]?{kind:'question',id:state.retryQueue[state.retryIndex],phase:'retry'}:null;return buildActivityQueue()[state.activityIndex]||null;}function currentQuestion(){const a=currentActivity();return a?.kind==='question'?QUESTION_BANK.find(q=>q.id===a.id):null;}function setProgress(){const done=state.mode==='retry'?state.retryIndex:state.activityIndex;const total=state.mode==='retry'?Math.max(1,state.retryQueue.length):buildActivityQueue().length;const percent=Math.round(done/total*100);progress.style.width=`${percent}%`;progress.setAttribute('aria-valuenow',percent);}
function home(){state.screen='home';pauseButton.hidden=true;setProgress();const resumable=state.activityIndex>0&&state.status!=='completed';app.innerHTML=`<section class="hero"><div class="mark" aria-hidden="true">⚖️</div><p class="pill">二年级数学 · 第六单元</p><h1>公平分配探险队</h1><p class="lead">用分盘、装袋、圈组和口诀，弄懂除法就是把总数公平地分开。</p><div class="pills"><span class="pill">约60分钟</span><span class="pill">9个探索</span><span class="pill">22道固定练习</span><span class="pill">中途可休息</span></div><div class="report-card"><h2>这次会学什么？</h2><p>公平分的意思、分成几份和每份几个、除法算式、口诀求商和生活分配。</p></div><div class="actions" style="justify-content:center;margin-top:22px"><button id="start-course" class="primary">${resumable?'继续探险':'开始探险'} 🧭</button>${state.status==='completed'?'<button id="view-report" class="secondary">查看探险报告</button>':''}</div></section>`;document.querySelector('#start-course').onclick=()=>{state.status='learning';state.screen='activity';save();render();};document.querySelector('#view-report')?.addEventListener('click',report);}
function explorationView(explore){const isPlates=explore.type==='plates',isFamily=explore.id==='explore-family-house';let board=isPlates?`<div class="plates">${[0,1,2].map(i=>`<div class="plate" data-plate="${i}"><small>盘子 ${i+1}</small><span></span></div>`).join('')}</div><p><span id="items-left">12</span> 个星星还没分</p>`:explore.id==='explore-fact-chant'?'<div class="expression">三四十二 → 12 ÷ 3 = 4</div>':explore.id==='explore-check-multiply'?'<div class="expression">4 × 3 = 12</div>':isFamily?`<div class="stepper">${factFamily(3,4).map((x,i)=>`<button class="step" data-family="${i}" aria-pressed="false">${i+1}</button>`).join('')}</div><p id="family-text">点亮四张卡</p>`:'<div class="expression">分一分、圈一圈，再把发现说出来。</div>';app.innerHTML=`<section><div class="lesson-head"><span class="pill">${PHASES[explore.phase].title}</span><span class="counter">探索</span></div><h1 class="prompt">${explore.title}</h1><p class="lead">${explore.instruction}</p><div class="board">${board}</div><div id="feedback"></div><button id="do-exploration" class="primary explore-control">${isPlates?'轮流放一颗星星':isFamily?'完成关系屋':'完成这次探索'}</button></section>`;let placed=0;if(isPlates){document.querySelector('#do-exploration').onclick=()=>{if(placed<12){const target=document.querySelector(`[data-plate="${placed%3}"] span`);target.insertAdjacentHTML('beforeend','<i class="item" aria-hidden="true">★</i>');placed++;document.querySelector('#items-left').textContent=12-placed;if(placed<12)return;}completeExploration(explore);};}else if(isFamily){const cards=[...document.querySelectorAll('[data-family]')];cards.forEach(card=>card.onclick=()=>{card.setAttribute('aria-pressed','true');card.textContent=factFamily(3,4)[Number(card.dataset.family)];document.querySelector('#family-text').textContent='继续点亮所有关系卡。';if(cards.every(x=>x.getAttribute('aria-pressed')==='true'))completeExploration(explore);});document.querySelector('#do-exploration').onclick=()=>completeExploration(explore);}else document.querySelector('#do-exploration').onclick=()=>completeExploration(explore);}
function completeExploration(explore){if(!state.completedExplorations.includes(explore.id))state.completedExplorations.push(explore.id);state.current.explorationStep=0;save();document.querySelector('#feedback').innerHTML=`<div class="feedback success"><h2>探索完成！</h2><p>${explore.success}</p><button id="next-activity" class="primary next">继续前进</button></div>`;document.querySelector('#do-exploration').hidden=true;document.querySelector('#next-activity').focus();document.querySelector('#next-activity').onclick=nextActivity;announce(`探索完成：${explore.success}`);}
function questionView(question){state.current.selectedAnswer=null;const opts=question.options.map((option,i)=>`<button class="answer" data-option-index="${i}" aria-pressed="false">${option}</button>`).join('');app.innerHTML=`<section><div class="lesson-head"><span class="pill">${state.mode==='retry'?'重练任务':PHASES[question.phase].title}</span><span class="counter">练习</span></div><h1 class="prompt">${question.prompt}</h1><div class="expression">${question.expression}</div><div class="options">${opts}</div><div class="actions"><button id="submit-answer" class="primary" disabled>提交答案</button><button id="hint-button" class="secondary">看提示</button></div><div id="feedback"></div></section>`;document.querySelectorAll('[data-option-index]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-option-index]').forEach(x=>x.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');state.current.selectedAnswer=question.options[Number(button.dataset.optionIndex)];document.querySelector('#submit-answer').disabled=false;});document.querySelector('#hint-button').onclick=()=>showHint(question);document.querySelector('#submit-answer').onclick=()=>submit(question);}
function showHint(question){state.current.maxHintLevel=Math.min(3,state.current.maxHintLevel+1);save();const hint=getHint(question,state.current.maxHintLevel);const heads=['先找方向','看图表示','完整推导'];document.querySelector('#feedback').innerHTML=`<div class="feedback"><h2>${heads[hint.level-1]}</h2><p>${hint.text}</p></div>`;announce(hint.text);}
function submit(question){const answer=state.current.selectedAnswer;if(answer===null)return;state.current.attempts++;const correct=evaluateAnswer(question,answer),mis=detectMisconception(question,answer);let record=state.records.find(r=>r.questionId===question.id);if(state.mode==='retry'){state.retryResults.push({questionId:question.id,answer,correct,attempts:state.current.attempts});save();showResult(question,correct,mis,true);return;}if(!record){record={questionId:question.id,objective:question.objective,dimension:question.dimension,firstAnswer:answer,firstCorrect:correct,firstHintLevel:state.current.maxHintLevel,firstMisconception:mis,attempts:state.current.attempts,maxHintLevel:state.current.maxHintLevel,resolved:correct};state.records.push(record);}else{record.attempts=state.current.attempts;record.maxHintLevel=Math.max(record.maxHintLevel,state.current.maxHintLevel);record.resolved=record.resolved||correct;}state.current.lastMisconception=mis;save();showResult(question,correct,mis,false);}
function showResult(question,correct,mis,retry){const notes={ 'swapped-total-and-groups':'总数要写在除号左边；先看是分成几份，还是每份几个。','each-size-as-group-count':'“每份几个”和“有几份”不是同一个数，按题目问的来。','multiplication-instead-of-division':'这是平均分，要用除法；再用乘法检查。','only-quotient-no-context':'商要说清在故事里代表每份几个或几份。'};document.querySelector('#feedback').innerHTML=correct?`<div class="feedback success"><h2>${retry?'重练答对了！':'这次分对了！'}</h2><p>${question.explanation}</p><button id="next-activity" class="primary next">${retry?'下一道重练':'继续前进'}</button></div>`:`<div class="feedback bad"><h2>再想一想</h2><p>${notes[mis]||'先看总数、怎样分，再试一次。'}</p><p>可以继续看提示，提示会一层层展开。</p></div>`;if(correct)document.querySelector('#next-activity').onclick=nextActivity;announce(correct?'答对了。':'再想一想。');}
function breakView(){app.innerHTML='<section class="hero"><div class="mark">🧃</div><h1>补给休息站</h1><p class="lead">眼睛看远处20秒，喝一口水，伸伸手臂。准备好时再继续，不用倒计时。</p><div class="pills"><span class="pill">看远处</span><span class="pill">喝口水</span><span class="pill">伸伸腰</span></div><button id="continue-break" class="primary">准备好了，继续</button></section>';document.querySelector('#continue-break').onclick=()=>{state.breakCompleted=true;nextActivity();};}
function nextActivity(){if(state.mode==='retry'){state.retryIndex++;state.current={selectedAnswer:null,maxHintLevel:0,attempts:0,lastMisconception:null,explorationStep:0};if(state.retryIndex>=state.retryQueue.length){state.mode='learn';state.status='completed';state.screen='report';save();report();}else{save();render();}return;}state.activityIndex++;state.current={selectedAnswer:null,maxHintLevel:0,attempts:0,lastMisconception:null,explorationStep:0};if(state.activityIndex>=buildActivityQueue().length){state.status='completed';state.screen='report';save();report();}else{save();render();}}
function render(){state.screen='activity';pauseButton.hidden=false;setProgress();const activity=currentActivity();if(!activity){report();return;}if(activity.kind==='exploration')explorationView(EXPLORATIONS.find(x=>x.id===activity.id));else if(activity.kind==='question')questionView(QUESTION_BANK.find(x=>x.id===activity.id));else breakView();}
function report(){state.screen='report';pauseButton.hidden=true;state.status='completed';save();setProgress();const r=buildReport(state.records,QUESTION_BANK,state.retryResults);app.innerHTML=`<section><div class="hero"><div class="mark">🏆</div><h1>公平分配探险完成！</h1><p class="lead">首答记录会保留，重练只记录新的恢复证据。</p></div><div class="summary"><div><strong>${r.completed}</strong>已作答</div><div><strong>${r.independentFirstCorrect}</strong>独立首答正确</div><div><strong>${r.supportedFirstCorrect}</strong>提示支持正确</div></div><div class="report-grid">${Object.entries(r.dimensions).map(([key,v])=>`<article class="report-card"><h2>${({meaning:'除法含义',model:'分物模型',relation:'口诀与乘除关系',application:'生活应用'})[key]}</h2><p>独立 ${v.independent} · 提示支持 ${v.supported} · 需练习 ${v.needsPractice}</p></article>`).join('')}</div><div class="report-card"><h2>下一步</h2><p>${r.nextSteps.join('；')}</p></div><details><summary>家长查看学习详情</summary><p>未答：${r.unansweredIds.join('、')||'无'}。</p><p>错因：${Object.entries(r.misconceptions).map(([k,v])=>`${k} × ${v}`).join('；')||'暂未记录'}。</p><p>提示使用题数：${r.hintUsage.questions}；重练答对：${r.retry.correct}/${r.retry.attempted}。</p></details><div class="actions"><button id="retry-wrong" class="primary">只重练首答错题</button><button id="report-restart" class="secondary">重新探险</button></div></section>`;document.querySelector('#retry-wrong').onclick=()=>{state.retryQueue=state.records.filter(x=>!x.firstCorrect).map(x=>x.questionId);state.retryIndex=0;if(!state.retryQueue.length){announce('没有首答错题，真棒！');return;}state.mode='retry';state.status='retry';save();render();};document.querySelector('#report-restart').onclick=openReset;}
function openReset(){dialog=document.createElement('div');dialog.className='dialog-wrap';dialog.innerHTML='<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title"><h2 id="reset-title">重新开始本单元？</h2><p>只会删除《公平分配探险队》的本机进度，其他单元不会改变。</p><div class="actions"><button id="confirm-restart" class="primary">确定重新开始</button><button id="cancel-restart" class="secondary">取消</button></div></section>';document.body.append(dialog);const confirm=dialog.querySelector('#confirm-restart'),cancel=dialog.querySelector('#cancel-restart');confirm.focus();confirm.onclick=()=>{localStorage.removeItem(SAVE_KEY);state=createInitialState();dialog.remove();dialog=null;home();};cancel.onclick=closeReset;dialog.addEventListener('keydown',event=>{if(event.key==='Escape')closeReset();if(event.key==='Tab'){event.preventDefault();(document.activeElement===confirm?cancel:confirm).focus();}});}
function closeReset(){dialog?.remove();dialog=null;document.querySelector('#report-restart')?.focus();}
pauseButton.onclick=()=>{state.status='learning';state.screen='home';save();home();};speechButton.onclick=()=>{if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){speechButton.hidden=true;return;}if(speechButton.getAttribute('aria-pressed')==='true'){speechSynthesis.cancel();speechButton.setAttribute('aria-pressed','false');speechButton.setAttribute('aria-label','朗读当前内容');speechButton.textContent='🔊 朗读';return;}const utterance=new SpeechSynthesisUtterance(app.innerText);utterance.onend=utterance.onerror=()=>{speechButton.setAttribute('aria-pressed','false');speechButton.setAttribute('aria-label','朗读当前内容');speechButton.textContent='🔊 朗读';};speechButton.setAttribute('aria-pressed','true');speechButton.setAttribute('aria-label','停止朗读');speechButton.textContent='⏹️ 停止朗读';speechSynthesis.speak(utterance);};if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window))speechButton.hidden=true;Object.assign(window.DivisionAdventureTestHooks,{getCurrentActivity:()=>clone(currentActivity()),getCurrentQuestion:()=>clone(currentQuestion()),getState:()=>clone(state),clearProgress:()=>{localStorage.removeItem(SAVE_KEY);state=createInitialState();home();}});home();
</script>
