    .board { margin:24px 0; padding:clamp(15px,3vw,28px); border:3px solid #c8e6ee; border-radius:25px; background:#f5fcff; } .ruler-notice { margin:0 0 15px; padding:11px 13px; border-left:5px solid #e39a20; border-radius:10px; color:#704c00; background:#fff3ce; font-weight:750; } .ruler { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:0; overflow:hidden; border-bottom:5px solid #305b74; background:white; } .tick { position:relative; min-height:90px; padding-top:45px; border-left:2px solid #305b74; color:#174962; text-align:center; font-weight:900; } .tick::before { content:""; position:absolute; top:0; left:-2px; width:2px; height:34px; background:#305b74; } .tick.major::before { height:45px; } .ruler-object { display:flex; align-items:center; justify-content:center; min-height:58px; margin-top:15px; border:3px solid #f1a441; border-radius:15px; color:#793d00; background:#ffe5ae; font-weight:900; } .ruler-object span { display:inline-block; width:var(--object-width,58%); border-top:7px solid #e8743c; } .ruler-controls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:16px; } .block-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; } .cm-block { width:52px; min-height:52px; padding:4px; border:3px solid #2b95a3; border-radius:10px; color:#135c70; background:#b9f0ec; } .cm-block[aria-pressed="true"] { color:#553b00; border-color:#e08b17; background:#ffdf80; } .choice-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; margin:24px 0; } .option { min-height:70px; border:3px solid #c7dfe9; color:#174c68; background:white; text-align:left; } .option.selected { border-color:#1b9a92; background:#dcf8ee; box-shadow:inset 0 0 0 2px #1b9a92; } .feedback { margin:20px 0; padding:17px; border-radius:19px; } .feedback h2 { margin:0 0 5px; font-size:1.25rem; } .feedback.good { border:3px solid #65bd91; background:#e4f8ea; } .feedback.hint { border:3px solid #edbb56; background:#fff5d8; } .feedback.bad { border:3px solid #da978d; background:#fff0eb; } .break { max-width:700px; margin:auto; text-align:center; } .stretch { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:24px 0; } .stretch div { padding:16px 10px; border-radius:19px; background:var(--mint); } .stretch span { display:block; font-size:2.2rem; } .report-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:22px 0; } .report-card { padding:17px; border:2px solid #c8dfe8; border-radius:20px; background:#f8fdff; } .report-card strong { display:block; color:var(--deep); font-size:1.8rem; } details { margin-top:20px; padding:14px; border:2px solid #c8dfe8; border-radius:17px; } summary { cursor:pointer; font-weight:900; } .dialog { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:18px; background:rgba(10,47,72,.66); } .dialog > div { width:min(510px,100%); padding:27px; border-radius:25px; background:white; box-shadow:var(--shadow); } .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  <div class="shell"><header class="topbar" aria-label="课程工具栏"><div class="brand">📏 小小测量师</div><div class="progress" aria-label="课程进度"><div id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div><div class="tools"><button id="speech-button" class="compact" type="button" aria-label="朗读当前内容" aria-pressed="false">🔊<span> 朗读</span></button><button id="pause-button" class="compact" type="button" aria-label="暂停并返回首页" hidden>⏸️<span> 暂停</span></button></div></header><main id="app"></main><div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div></div>
  <script>
  'use strict';
  /* TESTABLE_CORE_START */
  const SAVE_KEY='mathQuest.grade2.unit8.v1';
  const PHASES={centimeter:{title:'厘米小侦探',minutes:12},ruler:{title:'尺子读数站',minutes:12},meter:{title:'米的量感屋',minutes:10},estimate:{title:'估测检查营',minutes:12},application:{title:'生活测量站',minutes:14},break:{title:'测量休息站',minutes:2}};
  const EXPLORATIONS=[
    {id:'explore-cm-blocks',phase:'centimeter',title:'拼出厘米积木',instruction:'点击积木，拼出一段5厘米的小路。',type:'blocks',success:'每块代表1厘米，5块连起来是5厘米。'},
    {id:'explore-unit-match',phase:'centimeter',title:'给小物品选厘米',instruction:'看看铅笔和橡皮，选择合适的长度单位。',type:'simple',success:'小物品通常用厘米描述，更方便。'},
    {id:'explore-zero-align',phase:'ruler',title:'让起点对齐0刻度',instruction:'用键盘左右键或按钮移动铅笔，直到它的起点对准0。',type:'ruler',success:'从0刻度对齐，终点刻度才直接表示长度。'},
    {id:'explore-broken-ruler',phase:'ruler',title:'断尺也能量',instruction:'物体从3刻度到11刻度，试着说出长度。',type:'simple',success:'终点11减起点3，长度是8厘米。'},
    {id:'explore-meter-walk',phase:'meter',title:'走一走1米',instruction:'观察1米大约有多长，想想教室里哪些东西适合用米量。',type:'simple',success:'长长的物体或空间常用米来量。'},
    {id:'explore-estimate-slider',phase:'estimate',title:'先估再测',instruction:'先猜铅笔约几厘米，再看看测量结果。',type:'simple',success:'估测是先有合理猜想，再用测量来检查。'},
    {id:'explore-desk-plan',phase:'application',title:'量一量书桌',instruction:'选择工具和单位，给书桌边长做测量计划。',type:'simple',success:'书桌边长适合用尺或卷尺，并记录厘米。'},
    {id:'explore-height-check',phase:'application',title:'检查身高记录',instruction:'看一看身高和单位是否合理。',type:'simple',success:'身高常用厘米记录，数量也要符合生活经验。'}
  ];
  function q(id,phase,dimension,objective,prompt,answer,options,hints,explanation,rules=[]){return{id,phase,dimension,objective,type:'choice',prompt,answer,options,hints,explanation,misconceptionRules:rules};}
  const QUESTION_BANK=[
    q('unit-01','centimeter','unitSense','unit-sense','一支铅笔大约长多少，适合用什么单位？','厘米',['厘米','米','千米'],['先看物体是小还是大。','铅笔放在书包里，是小物品。','铅笔长度通常用厘米表示。'],'小物品的长度常用厘米。',[{code:'unit-confusion',answers:['米','千米']}]),
    q('unit-02','centimeter','unitSense','unit-sense','量教室的长度，选择什么单位更合适？','米',['厘米','米','千米'],['想想教室比一支铅笔长很多。','用厘米要写很多很多数字。','教室长度通常用米表示。'],'大空间的长度常用米。',[{code:'unit-confusion',answers:['厘米','千米']}]),
    q('unit-03','centimeter','unitSense','unit-sense','橡皮大约长4（  ）。','厘米',['厘米','米','千米'],['先和手指宽度比一比。','4米比一张桌子还长。','橡皮约长4厘米。'],'橡皮是小物品，用厘米。',[{code:'unit-confusion',answers:['米','千米']}]),
    q('unit-04','centimeter','unitSense','unit-sense','操场跑道的一段很长，最合理的单位是？','米',['厘米','米','千米'],['比较厘米和米哪个更适合长距离。','用厘米记录跑道会有很长一串数字。','操场的一段长度用米较合适。'],'较长距离常用米。',[{code:'unit-confusion',answers:['厘米','千米']}]),
    q('unit-05','centimeter','unitSense','unit-sense','哪一个长度最可能是合理的？','15厘米',['15厘米','15米','15千米'],['先想一想一本书有多长。','15米大约有几层楼高。','一本书长约15厘米很合理。'],'一本书的长度通常是十几厘米。',[{code:'estimate-scale',answers:['15米','15千米']}]),
    q('ruler-01','ruler','ruler','read-ruler','铅笔从0刻度开始，末端对着7刻度，长多少？','7厘米',['6厘米','7厘米','从1开始数','8厘米'],['先找物体的起点。','起点在0，读终点刻度。','从0到7是7厘米。'],'从0开始对齐，终点7就是7厘米。',[{code:'count-from-one',answers:['从1开始数','6厘米']}]),
    q('ruler-02','ruler','ruler','read-ruler','纸条起点对着0，终点对着9，长度是？','9厘米',['8厘米','9厘米','10厘米'],['起点在哪里？','起点在0时，看终点。','终点是9，所以长9厘米。'],'从0刻度测量，终点刻度就是长度。',[{code:'count-from-one',answers:['8厘米']}]),
    q('ruler-03','ruler','ruler','read-ruler','测量前最规范的第一步是什么？','让物体起点对准0刻度',['从1刻度开始','让物体起点对准0刻度','只看终点'],['先想尺子上的哪个刻度表示开始。','0刻度是测量的开始位置。','让物体起点对准0刻度，再读终点。'],'规范测量要从0刻度开始。',[{code:'count-from-one',answers:['从1刻度开始']}]),
    q('ruler-04','ruler','ruler','broken-ruler','一根绳子从尺子的3刻度到11刻度，长多少？','8厘米',['3厘米','11厘米','8厘米','14厘米'],['这次起点不是0。','长度要看两个刻度相差多少。','11减3等于8，所以绳子长8厘米。'],'不从0开始时，用终点减起点。',[{code:'use-end-mark',answers:['11厘米']},{code:'count-from-one',answers:['3厘米']}]),
    q('ruler-05','ruler','ruler','broken-ruler','从5刻度到12刻度，物体长多少？','7厘米',['5厘米','7厘米','12厘米'],['先找起点和终点。','不能把终点刻度直接当长度。','12减5等于7厘米。'],'断尺测量用终点刻度减起点刻度。',[{code:'use-end-mark',answers:['12厘米']}]),
    q('estimate-01','estimate','estimate','estimate-check','估计8厘米，实际量得12厘米，原来的估计怎样？','偏小',['偏小','正好','偏大'],['比一比估计数和实际数。','8比12小。','估计8厘米小于实际12厘米，所以偏小。'],'估计小于实际，叫偏小。',[{code:'estimate-scale',answers:['偏大']}]),
    q('estimate-02','estimate','estimate','estimate-check','估计20厘米，实际量得15厘米，原来的估计怎样？','偏大',['偏小','正好','偏大'],['比一比两个数。','20比15大。','估计20厘米大于实际15厘米，所以偏大。'],'估计大于实际，叫偏大。',[{code:'estimate-scale',answers:['偏小']}]),
    q('estimate-03','estimate','estimate','estimate-check','估计9厘米，实际量得9厘米，估计怎样？','正好',['偏小','正好','偏大'],['两个数一样吗？','9和9相等。','估计和实际都是9厘米，正好。'],'估计等于实际，就是正好。',[]),
    q('estimate-04','estimate','estimate','estimate-check','一根手指大约长60（ ），这个估计合理吗？','不合理',['合理','不合理','无法判断'],['先想一想60厘米有多长。','60厘米接近一把小尺的长度。','一根手指不可能长60厘米，所以不合理。'],'估测要符合生活中的大小。',[{code:'estimate-scale',answers:['合理']}]),
    q('estimate-05','estimate','estimate','estimate-check','先估后测有什么好处？','能检查估计是否合理',['可以不测量','能检查估计是否合理','只要记住数字'],['估计后还需要做什么？','用尺子或卷尺量一量。','把估计和测量结果相比，能检查是否合理。'],'先估后测能帮助我们建立长度量感。',[{code:'skip-check',answers:['可以不测量']}]),
    q('app-01','application','application','life-measure','量书桌的一条边，最合适的工具和单位是？','直尺和厘米',['直尺和厘米','卷尺和米','不用工具'],['书桌边不是很长。','想想直尺能量哪些物品。','书桌边适合用直尺量，用厘米记录。'],'短边可用直尺和厘米。',[{code:'unit-confusion',answers:['卷尺和米']}]),
    q('app-02','application','application','life-measure','量教室门到黑板的距离，最合适的是？','卷尺和米',['直尺和厘米','卷尺和米','手指和厘米'],['比较两地之间有多远。','直尺太短，要反复移动很多次。','长距离适合用卷尺，并用米记录。'],'较长距离用卷尺和米更方便。',[{code:'unit-confusion',answers:['直尺和厘米','手指和厘米']}]),
    q('app-03','application','application','life-measure','小明说自己身高2厘米，应该怎样判断？','不合理，身高常用厘米但数字应大得多',['合理','不合理，身高常用厘米但数字应大得多','应该用米但不用数字'],['想想2厘米和一粒花生差不多吗。','身高常用厘米记录，但有一百多厘米。','单位可以是厘米，2这个数字却太小，不合理。'],'单位和数量都要符合生活经验。',[{code:'estimate-scale',answers:['合理']}]),
    q('app-04','application','application','life-measure','一根彩带从4刻度到14刻度，做贺卡要剪多长？','10厘米',['4厘米','10厘米','14厘米'],['彩带从哪个刻度开始？','用终点14减起点4。','14减4等于10，所以剪10厘米。'],'不是从0开始也能量，用两个刻度相减。',[{code:'use-end-mark',answers:['14厘米']}]),
    q('app-05','application','application','life-measure','量完一本书长18厘米，怎样检查记录？','确认单位是厘米，并想想18厘米是否合理',['把18改成180','不写单位','确认单位是厘米，并想想18厘米是否合理'],['记录里除了数字还有什么？','长度记录需要数字和单位。','18厘米对一本书合理，还要写清厘米。'],'测量记录要有数字、单位和合理性检查。',[{code:'ignore-unit',answers:['不写单位']}])
  ];
  function measureFromZero(end){if(!Number.isFinite(end)||end<0)throw new Error('刻度必须是非负数');return end;}
  function measureBetweenMarks(start,end){if(!Number.isFinite(start)||!Number.isFinite(end)||start<0||end<0)throw new Error('刻度必须是非负数');if(end<start)throw new Error('终点刻度不能小于起点');return end-start;}
  function chooseUnit(item,unit){return ({'铅笔长度':'厘米','教室长度':'米','身高':'厘米','绳子长度':'米'})[item]===unit;}
  function compareEstimate(estimate,actual){return estimate===actual?'相同':estimate>actual?'偏大':'偏小';}
  function evaluateAnswer(question,answer){return String(answer??'').trim()===String(question.answer).trim();}
  function getHint(question,level){const safe=Math.max(1,Math.min(3,Number(level)||1));return{level:safe,text:question.hints[safe-1]};}
  function detectMisconception(question,answer){const hit=(question.misconceptionRules||[]).find((rule)=>rule.answers.map(String).includes(String(answer)));return hit?hit.code:null;}
  function buildActivityQueue(){const e=(id)=>({kind:'exploration',id,phase:EXPLORATIONS.find(x=>x.id===id).phase});const qItem=(id)=>({kind:'question',id,phase:QUESTION_BANK.find(x=>x.id===id).phase});return[e('explore-cm-blocks'),qItem('unit-01'),qItem('unit-02'),e('explore-unit-match'),qItem('unit-03'),qItem('unit-04'),qItem('unit-05'),e('explore-zero-align'),qItem('ruler-01'),qItem('ruler-02'),{kind:'break',id:'measurement-break',phase:'break'},qItem('ruler-03'),e('explore-broken-ruler'),qItem('ruler-04'),qItem('ruler-05'),e('explore-meter-walk'),qItem('estimate-01'),qItem('estimate-02'),e('explore-estimate-slider'),qItem('estimate-03'),qItem('estimate-04'),qItem('estimate-05'),e('explore-desk-plan'),qItem('app-01'),qItem('app-02'),e('explore-height-check'),qItem('app-03'),qItem('app-04'),qItem('app-05')];}
  const ACTIVITY_QUEUE=buildActivityQueue();
  function createInitialState(){return{version:1,screen:'home',activityIndex:0,records:[],completedExplorations:[],breakCompleted:false,current:{selectedAnswer:null,maxHintLevel:0,attempts:0,rulerMark:1},retryQueue:[],retryResults:[],mode:'learning'};}
  function validRecord(r){const q=QUESTION_BANK.find(x=>x.id===r?.questionId);return !!q&&typeof r.firstCorrect==='boolean'&&Number.isInteger(r.firstHintLevel)&&r.firstHintLevel>=0&&r.firstHintLevel<=3&&Number.isInteger(r.attempts)&&r.attempts>=1&&typeof r.resolved==='boolean';}
  function validateSave(value){if(!value||value.version!==1||!['home','activity','report','retry'].includes(value.screen)||!Number.isInteger(value.activityIndex)||value.activityIndex<0||value.activityIndex>=ACTIVITY_QUEUE.length||!value.current||!Number.isInteger(value.current.maxHintLevel)||value.current.maxHintLevel<0||value.current.maxHintLevel>3)return false;if(!Array.isArray(value.records)||!Array.isArray(value.completedExplorations)||!Array.isArray(value.retryQueue)||!Array.isArray(value.retryResults))return false;const exp=new Set(value.completedExplorations);if(exp.size!==value.completedExplorations.length||[...exp].some(id=>!EXPLORATIONS.some(x=>x.id===id)))return false;const ids=value.records.map(r=>r.questionId);if(new Set(ids).size!==ids.length||value.records.some(r=>!validRecord(r)))return false;const retryIds=new Set(value.retryQueue);if(retryIds.size!==value.retryQueue.length||[...retryIds].some(id=>!QUESTION_BANK.some(x=>x.id===id)))return false;if(value.screen==='report'&&value.records.length!==QUESTION_BANK.length)return false;return true;}
  function buildReport(records,bank=QUESTION_BANK,retryResults=[]){const dimensions=Object.fromEntries(['unitSense','ruler','estimate','application'].map(d=>[d,{independent:0,supported:0,needsPractice:0,total:5}]));const misconceptions={};let independentFirstCorrect=0,supportedFirstCorrect=0,hintQuestions=0;for(const r of records){const d=dimensions[r.dimension];if(!d)continue;if(r.maxHintLevel>0)hintQuestions++;if(r.firstCorrect&&r.firstHintLevel===0){independentFirstCorrect++;d.independent++;}else if(r.firstCorrect){supportedFirstCorrect++;d.supported++;}else{d.needsPractice++;if(r.firstMisconception)misconceptions[r.firstMisconception]=(misconceptions[r.firstMisconception]||0)+1;}}const unansweredIds=bank.filter(q=>!records.some(r=>r.questionId===q.id)).map(q=>q.id);const retry={attempted:retryResults.length,correct:retryResults.filter(r=>r.correct).length};const strengths=[];for(const[d,v]of Object.entries(dimensions))if(v.independent+v.supported>0)strengths.push(`${d}有成功证据`);return{completed:records.length,unanswered:unansweredIds.length,unansweredIds,independentFirstCorrect,supportedFirstCorrect,dimensions,misconceptions,hintUsage:{questions:hintQuestions},retry,strengths:strengths.length?strengths:['继续完成练习，积累测量证据'],nextSteps:['先让物体对准0刻度，再读终点。','量完要写数字和单位，并检查是否合理。']};}
  window.MeasurementLabTestHooks={SAVE_KEY,PHASES,EXPLORATIONS,QUESTION_BANK,ACTIVITY_QUEUE,measureFromZero,measureBetweenMarks,chooseUnit,compareEstimate,evaluateAnswer,getHint,detectMisconception,buildActivityQueue,createInitialState,validateSave,buildReport};
  /* TESTABLE_CORE_END */
  let state=createInitialState(),speechActive=false,dialogOpen=false;
  const app=document.querySelector('#app'),live=document.querySelector('#live-region'),progress=document.querySelector('#progress-bar'),pause=document.querySelector('#pause-button'),speech=document.querySelector('#speech-button');
  function announce(text){live.textContent=text;}
  function stopSpeech(){if(speechActive)speechSynthesis.cancel();speechActive=false;speech.setAttribute('aria-pressed','false');speech.setAttribute('aria-label','朗读当前内容');speech.innerHTML='🔊<span> 朗读</span>';}
  function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));}
  function restore(){try{const value=JSON.parse(localStorage.getItem(SAVE_KEY));if(validateSave(value))state=value;}catch{state=createInitialState();}}
  function currentActivity(){return state.mode==='retry'?{kind:'question',id:state.retryQueue[state.activityIndex],phase:'retry'}:ACTIVITY_QUEUE[state.activityIndex];}
  function currentQuestion(){const a=currentActivity();return a?.kind==='question'?QUESTION_BANK.find(q=>q.id===a.id):null;}
  function setProgress(){const done=state.mode==='retry'?state.activityIndex:state.activityIndex;const total=state.mode==='retry'?Math.max(1,state.retryQueue.length):ACTIVITY_QUEUE.length;const value=Math.round(done/total*100);progress.style.width=value+'%';progress.setAttribute('aria-valuenow',value);}
  function render(){setProgress();pause.hidden=state.screen!=='activity'&&state.screen!=='retry';if(state.screen==='home')return renderHome();if(state.screen==='report')return renderReport();return renderActivity();}
  function renderHome(){const resume=state.activityIndex>0&&state.records.length<QUESTION_BANK.length;app.innerHTML=`<section class="hero" aria-labelledby="course-title"><div class="hero-mark" aria-hidden="true">📏</div><p class="chip">二年级数学 · 第八单元</p><h1 id="course-title">小小测量师</h1><p class="lead">用厘米积木、屏幕尺和生活任务，学会选单位、从0刻度测量、用断尺相减，还能先估后测。</p><div class="facts"><span class="chip">⏱️ 建议60分钟</span><span class="chip">🧩 8个探索</span><span class="chip">✏️ 20道固定练习</span><span class="chip">🌿 中途可休息</span></div><div class="board"><strong>今天能做到：</strong><p>选厘米或米；让物体从0刻度开始；用终点减起点；估一估再检查；解决书桌、绳子和身高问题。</p></div><button id="start-course" class="primary" type="button">${resume?'继续学习':'开始测量之旅'} 📐</button>${resume?'<p>已保存你的学习位置，可以放心继续。</p>':''}</section>`;document.querySelector('#start-course').onclick=()=>{stopSpeech();state.screen='activity';state.mode='learning';save();render();};}
  function rulerMarkup(mark){return `<p class="ruler-notice">屏幕尺只用来理解刻度关系，不能保证真实物理尺寸，也不能代替校准后的实体尺。</p><div class="ruler" role="img" aria-label="从0到11的概念刻度尺">${Array.from({length:12},(_,n)=>`<div class="tick ${n%5===0?'major':''}">${n}</div>`).join('')}</div><div class="ruler-object" style="--object-width:${Math.max(10,mark*8)}%"><span></span></div>`;}
  function renderExploration(explore){let special='';if(explore.type==='blocks')special=`<div class="block-row">${Array.from({length:8},(_,i)=>`<button class="cm-block" data-cm-block="${i}" aria-pressed="false" type="button">1厘米</button>`).join('')}</div><p id="block-count">已选0块</p>`;else if(explore.type==='ruler')special=`${rulerMarkup(state.current.rulerMark)}<div class="ruler-controls"><button id="ruler-left" class="plain" type="button" aria-label="向左移动铅笔">← 左移</button><strong id="ruler-position" tabindex="0">起点现在对着 ${state.current.rulerMark} 刻度</strong><button id="ruler-right" class="plain" type="button" aria-label="向右移动铅笔">右移 →</button></div><p>把起点移动到0，再按“完成对齐”。</p>`;else special=`<div class="chips"><span class="chip">动手想一想</span><span class="chip">可以用Tab和Enter操作</span></div>`;app.innerHTML=`<section><div class="lesson-header"><span class="chip">探索 ${state.activityIndex+1}/29</span><span class="chip">${PHASES[explore.phase].title}</span></div><h1 class="prompt">${explore.title}</h1><p class="instruction">${explore.instruction}</p><div class="board">${special}</div><div id="feedback"></div><div class="actions"><button id="do-exploration" class="primary" type="button">${explore.type==='ruler'?'完成对齐':'完成探索'}</button></div></section>`;if(explore.type==='blocks'){let selected=[];document.querySelectorAll('[data-cm-block]').forEach(btn=>btn.onclick=()=>{const id=Number(btn.dataset.cmBlock);selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];btn.setAttribute('aria-pressed',selected.includes(id));document.querySelector('#block-count').textContent=`已选${selected.length}块`;});}if(explore.type==='ruler'){const move=(delta)=>{state.current.rulerMark=Math.max(0,Math.min(5,state.current.rulerMark+delta));renderExploration(explore);};document.querySelector('#ruler-left').onclick=()=>move(-1);document.querySelector('#ruler-right').onclick=()=>move(1);document.querySelector('#ruler-position').onkeydown=(e)=>{if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}if(e.key==='ArrowRight'){e.preventDefault();move(1);}};}document.querySelector('#do-exploration').onclick=()=>{if(explore.type==='ruler'&&state.current.rulerMark!==0){showFeedback('hint','还差一点','把铅笔起点移动到0刻度，才能完成对齐。');return;}if(explore.type==='blocks'&&document.querySelectorAll('.cm-block[aria-pressed="true"]').length!==5){showFeedback('hint','再拼一拼','请选择5块，每块代表1厘米。');return;}state.completedExplorations.push(explore.id);showFeedback('good','探索完成',explore.success,'继续');};}
  function showFeedback(kind,title,text,nextLabel){document.querySelector('#feedback').innerHTML=`<div class="feedback ${kind}"><h2>${title}</h2><p>${text}</p>${nextLabel?`<button id="next-activity" class="primary" type="button">${nextLabel}</button>`:''}</div>`;announce(`${title}：${text}`);if(nextLabel)document.querySelector('#next-activity').onclick=advance;}
  function renderQuestion(question){const selected=state.current.selectedAnswer;app.innerHTML=`<section><div class="lesson-header"><span class="chip">练习 ${state.activityIndex+1}/29</span><span class="chip">${PHASES[question.phase]?.title||'重练'}</span></div><h1 class="prompt">${question.prompt}</h1><p class="instruction">选一个答案。答错也没关系，提示会一步一步带你想明白。</p>${question.phase==='ruler'?`<div class="board">${rulerMarkup(7)}</div>`:''}<div class="choice-grid">${question.options.map((option,index)=>`<button class="option ${String(selected)===String(option)?'selected':''}" data-option-index="${index}" aria-pressed="${String(selected)===String(option)}" type="button">${option}</button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="submit-answer" class="primary" type="button" ${selected===null?'disabled':''}>提交答案</button><button id="show-hint" class="secondary" type="button">看提示</button></div></section>`;document.querySelectorAll('[data-option-index]').forEach(btn=>btn.onclick=()=>{state.current.selectedAnswer=question.options[Number(btn.dataset.optionIndex)];renderQuestion(question);});document.querySelector('#show-hint').onclick=()=>{state.current.maxHintLevel=Math.min(3,state.current.maxHintLevel+1);const hint=getHint(question,state.current.maxHintLevel);showFeedback('hint',['先找方向','看图表示','完整方法'][hint.level-1],hint.text);save();};document.querySelector('#submit-answer').onclick=()=>submitAnswer(question);}
  function submitAnswer(question){const answer=state.current.selectedAnswer;state.current.attempts++;const correct=evaluateAnswer(question,answer);const existing=state.records.find(r=>r.questionId===question.id);if(state.mode==='retry'){state.retryResults.push({questionId:question.id,answer,correct,attempts:state.current.attempts});showFeedback(correct?'good':'bad',correct?'重练完成':'再想一想',correct?'这次答对了，首答记录仍然保留。':'可以打开提示，再试一次。',correct?'继续':'');save();return;}if(!existing){state.records.push({questionId:question.id,objective:question.objective,dimension:question.dimension,firstAnswer:answer,firstCorrect:correct,firstHintLevel:state.current.maxHintLevel,firstMisconception:correct?null:detectMisconception(question,answer),attempts:state.current.attempts,maxHintLevel:state.current.maxHintLevel,resolved:correct});}else{existing.attempts++;existing.maxHintLevel=Math.max(existing.maxHintLevel,state.current.maxHintLevel);existing.resolved=existing.resolved||correct;}if(correct){showFeedback('good','测量任务完成',question.explanation,'继续');}else{state.current.maxHintLevel=Math.min(3,state.current.maxHintLevel+1);const hint=getHint(question,state.current.maxHintLevel);const code=detectMisconception(question,answer);const correction=code?` 你刚才可能是：${({ 'count-from-one':'从1开始数','use-end-mark':'把终点刻度直接当长度','unit-confusion':'把厘米和米混用了','estimate-scale':'忽略了数量级','ignore-unit':'忽略了单位','skip-check':'没有进行检查'})[code]||'需要换个方法'}。`:'';showFeedback('hint',['先找方向','看图表示','完整方法'][hint.level-1],hint.text+correction);}save();}
  function renderBreak(){app.innerHTML=`<section class="break"><p class="chip">自主休息站 · 2—3分钟</p><h1>测量休息站</h1><p class="lead">眼睛和小手都辛苦了。你可以喝口水、看看远处，也可以现在继续；没有倒计时。</p><div class="stretch"><div><span>🙆</span>伸伸手臂</div><div><span>👀</span>看看远处</div><div><span>💧</span>喝口水</div></div><button id="continue-break" class="primary" type="button">准备好了，继续测量</button></section>`;document.querySelector('#continue-break').onclick=()=>{state.breakCompleted=true;advance();};}
  function renderActivity(){const activity=currentActivity();if(!activity){state.screen='report';save();return render();}if(activity.kind==='exploration')return renderExploration(EXPLORATIONS.find(x=>x.id===activity.id));if(activity.kind==='break')return renderBreak();renderQuestion(currentQuestion());}
  function advance(){stopSpeech();state.current={selectedAnswer:null,maxHintLevel:0,attempts:0,rulerMark:1};state.activityIndex++;if(state.mode==='retry'){if(state.activityIndex>=state.retryQueue.length){state.mode='learning';state.screen='report';}else state.screen='retry';}else if(state.activityIndex>=ACTIVITY_QUEUE.length)state.screen='report';else state.screen='activity';save();render();}
  function renderReport(){const report=buildReport(state.records,QUESTION_BANK,state.retryResults);app.innerHTML=`<section><div class="hero"><div class="hero-mark" aria-hidden="true">🏅</div><h1>小小测量师报告</h1><p class="lead">你完成了${report.completed}道正式题。首答证据和重练结果分开保存，能更清楚看见成长。</p></div><div class="report-grid">${Object.entries(report.dimensions).map(([name,v])=>`<article class="report-card"><h2>${({unitSense:'单位量感',ruler:'规范测量',estimate:'估测检查',application:'生活应用'})[name]}</h2><strong>独立 ${v.independent} · 提示支持 ${v.supported}</strong><p>还需要练习：${v.needsPractice}题</p></article>`).join('')}</div><div class="board"><h2>下一步</h2><p>${report.nextSteps.join(' ')}</p><p>重练恢复：${report.retry.correct}/${report.retry.attempted}题。</p></div><details><summary>家长查看学习详情</summary><p>提示使用：${report.hintUsage.questions}题。常见错因：${Object.keys(report.misconceptions).length?Object.entries(report.misconceptions).map(([k,v])=>`${k} ${v}次`).join('；'):'暂未记录'}。</p><p>未答题：${report.unansweredIds.length?report.unansweredIds.join('、'):'无'}。</p></details><div class="actions"><button id="retry-button" class="secondary" type="button" ${state.records.filter(r=>!r.firstCorrect).length?'':'disabled'}>只重练首答错题</button><button id="restart-button" class="plain" type="button">重新开始</button></div></section>`;document.querySelector('#retry-button').onclick=startRetry;document.querySelector('#restart-button').onclick=showRestartDialog;}
  function startRetry(){state.retryQueue=state.records.filter(r=>!r.firstCorrect).map(r=>r.questionId);state.activityIndex=0;state.mode='retry';state.screen='retry';state.current={selectedAnswer:null,maxHintLevel:0,attempts:0,rulerMark:1};save();render();}
  function showRestartDialog(){dialogOpen=true;document.body.insertAdjacentHTML('beforeend',`<div id="restart-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="restart-title"><div><h2 id="restart-title">确定重新开始吗？</h2><p>本单元的学习记录会清除，其他单元不会受影响。</p><div class="actions"><button id="cancel-restart" class="plain" type="button">取消</button><button id="confirm-restart" class="primary" type="button">确定重新开始</button></div></div></div>`);const dialog=document.querySelector('#restart-dialog'),cancel=document.querySelector('#cancel-restart'),confirm=document.querySelector('#confirm-restart');confirm.focus();const close=()=>{dialog.remove();dialogOpen=false;document.querySelector('#restart-button')?.focus();};cancel.onclick=close;confirm.onclick=()=>{localStorage.removeItem(SAVE_KEY);state=createInitialState();dialog.remove();dialogOpen=false;render();};dialog.onkeydown=(e)=>{if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const controls=[cancel,confirm];const current=controls.indexOf(document.activeElement);if(e.shiftKey&&current===0){e.preventDefault();confirm.focus();}if(!e.shiftKey&&current===controls.length-1){e.preventDefault();cancel.focus();}}};}
  pause.onclick=()=>{stopSpeech();state.screen='home';save();render();};
  speech.onclick=()=>{if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){speech.hidden=true;return;}if(speechActive){stopSpeech();announce('已停止朗读');return;}const utterance=new SpeechSynthesisUtterance(app.innerText);utterance.lang='zh-CN';utterance.onend=()=>{stopSpeech();announce('朗读结束');};utterance.onerror=()=>{stopSpeech();announce('朗读出错，已停止');};speechActive=true;speech.setAttribute('aria-pressed','true');speech.setAttribute('aria-label','停止朗读');speech.innerHTML='⏹️<span> 停止</span>';speechSynthesis.speak(utterance);announce('正在朗读；再次点击停止');};
  Object.assign(window.MeasurementLabTestHooks,{getState:()=>structuredClone(state),getCurrentActivity:()=>structuredClone(currentActivity()),getCurrentQuestion:()=>structuredClone(currentQuestion()),clearProgress:()=>{localStorage.removeItem(SAVE_KEY);state=createInitialState();render();},isSpeechActive:()=>speechActive});
  restore();if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window))speech.hidden=true;render();
  </script>
