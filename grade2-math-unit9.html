function validTime(hour,minute){if(!Number.isInteger(hour)||hour<1||hour>12||!Number.isInteger(minute)||minute<0||minute>59)throw new Error('时间不合法');}function formatTime(hour,minute){validTime(hour,minute);return`${hour}:${String(minute).padStart(2,'0')}`;}function addMinutes(time,minutes){validTime(time?.hour,time?.minute);if(!Number.isInteger(minutes)||minutes<0)throw new Error('分钟必须是非负整数');const total=time.hour*60+time.minute+minutes;if(total>=13*60)throw new Error('不能跨日');return{hour:Math.floor(total/60),minute:total%60};}function countCategories(values){return values.reduce((out,value)=>{out[value]=(out[value]||0)+1;return out;},{});}function compareBars(counts,a,b){return counts[a]===counts[b]?'equal':counts[a]>counts[b]?a:b;}function norm(value){return String(value??'').trim();}function normalTime(value){const matched=norm(value).match(/^(\d{1,2}):(\d{1,2})$/);if(!matched)return norm(value);try{return formatTime(Number(matched[1]),Number(matched[2]));}catch{return norm(value);}}function evaluateAnswer(question,answer){if(norm(answer)==='')return false;if(typeof question.answer==='number')return Number(norm(answer))===question.answer;return normalTime(answer)===normalTime(question.answer);}function getHint(question,level){const safe=Math.max(1,Math.min(3,Number(level)||1));return{level:safe,text:question.hints[safe-1]};}function detectMisconception(question,answer){return(question.misconceptionRules||[]).find(rule=>rule.answers.some(value=>normalTime(value)===normalTime(answer)))?.code||null;}

const app=document.querySelector('#app'),live=document.querySelector('#live-region'),progress=document.querySelector('#progress-bar'),speech=document.querySelector('#speech-button'),pause=document.querySelector('#pause-button');let state=load(),dialog;const clone=x=>JSON.parse(JSON.stringify(x));function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));return validateSave(s)?s:createInitialState();}catch{return createInitialState();}}function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));}function announce(t){live.textContent='';setTimeout(()=>live.textContent=t,0);}function activity(){return state.mode==='retry'?(state.retryQueue[state.retryIndex]?{kind:'question',id:state.retryQueue[state.retryIndex],phase:'retry'}:null):buildActivityQueue()[state.activityIndex]||null;}function question(){const a=activity();return a?.kind==='question'?QUESTION_BANK.find(q=>q.id===a.id):null;}function setProgress(){const p=Math.round((state.mode==='retry'?state.retryIndex:state.activityIndex)/(state.mode==='retry'?Math.max(1,state.retryQueue.length):32)*100);progress.style.width=`${p}%`;progress.setAttribute('aria-valuenow',p);}function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();speech.setAttribute('aria-pressed','false');speech.setAttribute('aria-label','朗读当前内容');speech.textContent='🔊 朗读';}function home(){stopSpeech();state.screen='home';pause.hidden=true;setProgress();const resume=state.activityIndex>0&&state.status!=='completed';app.innerHTML=`<section class="hero"><div class="mark">🕵️</div><p class="pill">二年级数学 · 第九单元</p><h1>时间数据侦探</h1><p class="lead">观察钟面、沿时间轴推移、整理投票和安排作息，找出生活里的数学线索。</p><div class="pills"><span class="pill">约60分钟</span><span class="pill">9个探索</span><span class="pill">22道固定练习</span><span class="pill">中途可休息</span></div><article class="card"><h2>这次会学什么？</h2><p>读整时、半时和5分刻度；计算简单经过时间；收集数据、读条形图并安排合理作息。</p></article><p><button id="start-course" class="primary">${resume?'继续侦查':'开始侦查'} ⏱️</button>${state.status==='completed'?'<button id="view-report" class="secondary">查看侦探报告</button>':''}</p></section>`;document.querySelector('#start-course').onclick=()=>{state.status='learning';state.screen='activity';save();render();};document.querySelector('#view-report')?.addEventListener('click',report);}function clockBoard(){return'<div class="clock"><i id="hour-hand" class="hand hour"></i><i id="minute-hand" class="hand minute"></i></div><div class="clock-buttons"><button id="hour-plus" class="step">时针 +1</button><button id="minute-plus" class="step">分针 +5</button></div><p id="clock-read" class="expression">8:00</p>';}
function exploreView(e){let body=e.type==='clock'?clockBoard():e.type==='votes'?'<div class="votes">阅读、运动、阅读、绘画、阅读、运动</div><p class="expression">点击后按类别整理投票</p>':e.type==='bars'?'<div class="bars"><div class="bar-wrap"><div class="bar" style="height:120px">3</div>阅读</div><div class="bar-wrap"><div class="bar" style="height:80px">2</div>运动</div><div class="bar-wrap"><div class="bar" style="height:40px">1</div>绘画</div></div>':'<div class="steps">'+Array.from({length:6},(_,i)=>`<button class="step" data-step="${i}" aria-pressed="false">${i+1}</button>`).join('')+'</div><p>每一格表示5分钟。</p>';app.innerHTML=`<section><div class="lesson-head"><span class="pill">${PHASES[e.phase].title}</span><span class="counter">探索</span></div><h1 class="prompt">${e.title}</h1><p class="lead">${e.instruction}</p><div class="board">${body}</div><div id="feedback"></div><button id="do-exploration" class="primary">完成这次探索</button></section>`;let steps=0;const finish=()=>completeExplore(e);if(e.type==='clock'){let h=e.id==='explore-half-hour'?3:8,m=0;const redraw=()=>{document.querySelector('#hour-hand').style.transform=`rotate(${h*30+m/2}deg)`;document.querySelector('#minute-hand').style.transform=`rotate(${m*6}deg)`;document.querySelector('#clock-read').textContent=formatTime(h,m);};redraw();document.querySelector('#hour-plus').onclick=()=>{h=h===12?1:h+1;redraw();};document.querySelector('#minute-plus').onclick=()=>{m=(m+5)%60;redraw();};}else if(e.type==='ticks'){document.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{button.setAttribute('aria-pressed','true');steps++;if(steps>=4)finish();});}document.querySelector('#do-exploration').onclick=finish;}
function completeExplore(e){if(!state.completedExplorations.includes(e.id))state.completedExplorations.push(e.id);save();document.querySelector('#feedback').innerHTML=`<div class="feedback success"><h2>探索完成！</h2><p>${e.success}</p><button id="next-activity" class="primary">继续前进</button></div>`;document.querySelector('#do-exploration').hidden=true;document.querySelector('#next-activity').onclick=next;document.querySelector('#next-activity').focus();announce(e.success);}function questionView(q){state.current.selectedAnswer=null;app.innerHTML=`<section><div class="lesson-head"><span class="pill">${state.mode==='retry'?'重练任务':PHASES[q.phase].title}</span><span class="counter">练习</span></div><h1 class="prompt">${q.prompt}</h1><div class="expression">${q.expression}</div><div class="options">${q.options.map((o,i)=>`<button class="answer" data-option-index="${i}" aria-pressed="false">${o}</button>`).join('')}</div><div class="actions"><button id="submit-answer" class="primary" disabled>提交答案</button><button id="hint-button" class="secondary">看提示</button></div><div id="feedback"></div></section>`;document.querySelectorAll('[data-option-index]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-option-index]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');state.current.selectedAnswer=q.options[Number(b.dataset.optionIndex)];document.querySelector('#submit-answer').disabled=false;});document.querySelector('#hint-button').onclick=()=>hint(q);document.querySelector('#submit-answer').onclick=()=>submit(q);}function hint(q){state.current.maxHintLevel=Math.min(3,state.current.maxHintLevel+1);const h=getHint(q,state.current.maxHintLevel),heads=['先找方向','用刻度表示','完整演示'];save();document.querySelector('#feedback').innerHTML=`<div class="feedback"><h2>${heads[h.level-1]}</h2><p>${h.text}</p></div>`;announce(h.text);}function submit(q){const answer=state.current.selectedAnswer;state.current.attempts++;const correct=evaluateAnswer(q,answer),mis=detectMisconception(q,answer);if(state.mode==='retry'){state.retryResults.push({questionId:q.id,answer,correct,attempts:state.current.attempts});save();result(q,correct,mis,true);return;}let r=state.records.find(x=>x.questionId===q.id);if(!r){r={questionId:q.id,objective:q.objective,dimension:q.dimension,firstAnswer:answer,firstCorrect:correct,firstHintLevel:state.current.maxHintLevel,firstMisconception:mis,attempts:state.current.attempts,maxHintLevel:state.current.maxHintLevel,resolved:correct};state.records.push(r);}else{r.attempts=state.current.attempts;r.maxHintLevel=Math.max(r.maxHintLevel,state.current.maxHintLevel);r.resolved=r.resolved||correct;}save();result(q,correct,mis,false);}function result(q,ok,mis,retry){const notes={ 'hands-swapped':'短针看时，长针看分；两根针不能颠倒。','minute-scale':'每个大格是5分钟，不是1分钟。','elapsed-backward':'“后”表示向前推，结束时间应更晚。','chart-missed':'再逐格数柱子的高度，别漏掉一格。'};document.querySelector('#feedback').innerHTML=ok?`<div class="feedback success"><h2>${retry?'重练答对了！':'线索找对了！'}</h2><p>${q.explanation}</p><button id="next-activity" class="primary">${retry?'下一道重练':'继续前进'}</button></div>`:`<div class="feedback bad"><h2>再查一次线索</h2><p>${notes[mis]||'先确定起点或类别，再用刻度、计数来检查。'}</p></div>`;if(ok)document.querySelector('#next-activity').onclick=next;announce(ok?'答对了。':'再查一次线索。');}
function breakView(){app.innerHTML='<section class="hero"><div class="mark">☕</div><h1>侦探休息站</h1><p class="lead">看远处、喝一口水、活动肩膀。你决定何时继续，不用倒计时。</p><button id="continue-break" class="primary">准备好了，继续</button></section>';document.querySelector('#continue-break').onclick=()=>{state.breakCompleted=true;next();};}function next(){if(state.mode==='retry'){state.retryIndex++;state.current={selectedAnswer:null,maxHintLevel:0,attempts:0,clockMinute:0,clockHour:8,explorationStep:0};if(state.retryIndex>=state.retryQueue.length){state.mode='learn';state.status='completed';state.screen='report';save();report();}else{save();render();}return;}state.activityIndex++;state.current={selectedAnswer:null,maxHintLevel:0,attempts:0,clockMinute:0,clockHour:8,explorationStep:0};if(state.activityIndex>=32){state.status='completed';state.screen='report';save();report();}else{save();render();}}function render(){stopSpeech();state.screen='activity';pause.hidden=false;setProgress();const a=activity();if(a.kind==='exploration')exploreView(EXPLORATIONS.find(x=>x.id===a.id));else if(a.kind==='question')questionView(QUESTION_BANK.find(x=>x.id===a.id));else breakView();}
function report(){stopSpeech();state.screen='report';state.status='completed';pause.hidden=true;save();setProgress();const r=buildReport(state.records,QUESTION_BANK,state.retryResults),names={clock:'钟面读时',elapsed:'经过时间',data:'数据整理',application:'生活应用'};app.innerHTML=`<section><div class="hero"><div class="mark">🏆</div><h1>时间数据侦探结案！</h1><p class="lead">首答记录会保留；重练只记录新的恢复证据。</p></div><div class="summary"><div><strong>${r.completed}</strong>已作答</div><div><strong>${r.independentFirstCorrect}</strong>独立首答正确</div><div><strong>${r.supportedFirstCorrect}</strong>提示支持正确</div></div><div class="report-grid">${Object.entries(r.dimensions).map(([k,v])=>`<article class="card"><h2>${names[k]}</h2><p>独立 ${v.independent} · 提示支持 ${v.supported} · 需练习 ${v.needsPractice}</p></article>`).join('')}</div><article class="card"><h2>下一步</h2><p>${r.nextSteps.join('；')}</p></article><details><summary>家长查看学习详情</summary><p>未答：${r.unansweredIds.join('、')||'无'}。</p><p>错因：${Object.entries(r.misconceptions).map(([k,v])=>`${k} × ${v}`).join('；')||'暂未记录'}。</p></details><p class="actions"><button id="retry-wrong" class="primary">只重练首答错题</button><button id="report-restart" class="secondary">重新侦查</button></p></section>`;document.querySelector('#retry-wrong').onclick=()=>{state.retryQueue=state.records.filter(x=>!x.firstCorrect).map(x=>x.questionId);state.retryIndex=0;if(!state.retryQueue.length){announce('没有首答错题，真棒！');return;}state.mode='retry';state.status='retry';save();render();};document.querySelector('#report-restart').onclick=openReset;}function openReset(){dialog=document.createElement('div');dialog.className='dialog-wrap';dialog.innerHTML='<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title"><h2 id="reset-title">重新开始本单元？</h2><p>只会删除《时间数据侦探》的本机进度，其他单元不会改变。</p><p class="actions"><button id="confirm-restart" class="primary">确定重新开始</button><button id="cancel-restart" class="secondary">取消</button></p></section>';document.body.append(dialog);const yes=dialog.querySelector('#confirm-restart'),no=dialog.querySelector('#cancel-restart');yes.focus();yes.onclick=()=>{localStorage.removeItem(SAVE_KEY);state=createInitialState();dialog.remove();dialog=null;home();};no.onclick=closeReset;dialog.addEventListener('keydown',e=>{if(e.key==='Escape')closeReset();if(e.key==='Tab'){e.preventDefault();(document.activeElement===yes?no:yes).focus();}});}function closeReset(){dialog?.remove();dialog=null;document.querySelector('#report-restart')?.focus();}pause.onclick=()=>{state.status='learning';state.screen='home';save();home();};speech.onclick=()=>{if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){speech.hidden=true;return;}if(speech.getAttribute('aria-pressed')==='true'){stopSpeech();return;}const u=new SpeechSynthesisUtterance(app.innerText);u.onend=u.onerror=stopSpeech;speech.setAttribute('aria-pressed','true');speech.setAttribute('aria-label','停止朗读');speech.textContent='⏹️ 停止朗读';speechSynthesis.speak(u);};if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window))speech.hidden=true;Object.assign(window.TimeDataDetectiveTestHooks,{getCurrentActivity:()=>clone(activity()),getCurrentQuestion:()=>clone(question()),getState:()=>clone(state),clearProgress:()=>{localStorage.removeItem(SAVE_KEY);state=createInitialState();home();}});home();
</script></body></html>
