  function classifyAngleShape(shape){ if(shape==='two-rays')return 'angle'; if(shape==='curve')return 'not-angle'; throw new Error('未知图形'); }
  function matchView(object,position){ const views={house:{front:'door-window',side:'side-wall',back:'tree'}}; if(!views[object]||!views[object][position])throw new Error('未知观察位置'); return views[object][position]; }
  function moveOnGrid(point,direction){if(!point||!Number.isInteger(point.x)||!Number.isInteger(point.y))throw new Error('坐标无效'); const steps={东:[1,0],西:[-1,0],北:[0,-1],南:[0,1]}; if(!steps[direction])throw new Error('方向无效'); return {x:point.x+steps[direction][0],y:point.y+steps[direction][1]};}
  function followRoute(start,directions){if(!Array.isArray(directions))throw new Error('路线无效'); return directions.reduce((point,direction)=>moveOnGrid(point,direction),{...start});}

  Object.assign(window.SpaceGuideTestHooks,{getCurrentActivity:activity,getCurrentQuestion:question,getState:()=>clone(state),clearProgress});renderHome();
  </script>
