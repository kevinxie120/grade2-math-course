q('park-01','park','spaceMeasure','route','从喷泉向东走3米，再向北走5米，第一步方向是？','向东',['向西','向东','向北'],['先读路线中的第一句话。','“向东走3米”写在前面。','第一步是向东走3米。'],'路线要按顺序读，先向东。',[{code:'route-reversed',answers:['向西','向北']}],['路线','方向']),

function calculateBudget(budget,cost){if(!Number.isFinite(budget)||!Number.isFinite(cost)||budget<0||cost<0||cost>budget)throw new Error('金额不合法');return budget-cost}function fairShare(total,people){if(!Number.isInteger(total)||!Number.isInteger(people)||total<0||people<=0||total%people)throw new Error('不能平均分');return total/people}function followRouteDistance(segments){let x=0,y=0,distance=0;for(const s of segments){if(!s||!Number.isFinite(s.distance)||s.distance<0||!['东','西','北','南'].includes(s.direction))throw new Error('方向或距离不合法');distance+=s.distance;if(s.direction==='东')x+=s.distance;if(s.direction==='西')x-=s.distance;if(s.direction==='北')y+=s.distance;if(s.direction==='南')y-=s.distance}return{x,y,distance}}function scheduleEnd(start,minutes){if(!start||!Number.isInteger(start.hour)||!Number.isInteger(start.minute)||start.hour<0||start.hour>23||start.minute<0||start.minute>59||!Number.isInteger(minutes)||minutes<0)throw new Error('时间不合法');const total=start.hour*60+start.minute+minutes;return{hour:Math.floor(total/60)%24,minute:total%60}}function summarizeData(items){return items.reduce((out,item)=>(out[item]=(out[item]||0)+1,out),{})}function evaluateAnswer(q,a){if(a===null||a===undefined||String(a).trim()==='')return false;return typeof q.answer==='number'?Number(String(a).trim())===q.answer:String(a).trim()===String(q.answer).trim()}function getHint(q,level){const safe=Math.max(1,Math.min(3,Number(level)||1));return{level:safe,text:q.hints[safe-1]}}function detectMisconception(q,a){const rule=(q.misconceptionRules||[]).find(r=>r.answers.map(String).includes(String(a)));return rule?rule.code:null}

let state=createInitialState(),speechActive=false;const app=document.querySelector('#app'),live=document.querySelector('#live-region'),bar=document.querySelector('#progress-bar'),pause=document.querySelector('#pause-button'),speech=document.querySelector('#speech-button');function announce(t){live.textContent=t}function stopSpeech(){if(speechActive)speechSynthesis.cancel();speechActive=false;speech.setAttribute('aria-pressed','false');speech.setAttribute('aria-label','朗读当前内容');speech.innerHTML='🔊<span> 朗读</span>'}function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}function restore(){try{const v=JSON.parse(localStorage.getItem(SAVE_KEY));if(validateSave(v))state=v}catch{state=createInitialState()}}function currentActivity(){return state.mode==='retry'?{kind:'question',id:state.retryQueue[state.activityIndex],phase:'retry'}:ACTIVITY_QUEUE[state.activityIndex]}function currentQuestion(){const a=currentActivity();return a?.kind==='question'?QUESTION_BANK.find(q=>q.id===a.id):null}function render(){const total=state.mode==='retry'?Math.max(1,state.retryQueue.length):29,val=Math.round(state.activityIndex/total*100);bar.style.width=val+'%';bar.setAttribute('aria-valuenow',val);pause.hidden=state.screen!=='activity'&&state.screen!=='retry';if(state.screen==='home')return home();if(state.screen==='report')return report();activity()}function home(){const resume=state.activityIndex>0&&state.records.length<20;app.innerHTML=`<section class="hero"><div class="mark">🏙️</div><p class="chip">二年级数学 · 第十单元</p><h1>数学城市大挑战</h1><p class="lead">在购物、聚餐、公园和作息任务里，综合使用运算、路线、测量、时间和统计。没有排名，只有你的解题证据。</p><div class="facts"><span class="chip">⏱️ 建议60分钟</span><span class="chip">🧩 8个探索</span><span class="chip">✏️ 20道固定题</span><span class="chip">🌿 中途可休息</span></div><div class="board"><strong>今天能做到：</strong><p>选择合适运算；读路线、距离和单位；安排时间、阅读图表；说明并检查答案。</p></div><button id="start-course" class="primary">${resume?'继续挑战':'进入数学城市'} 🧭</button></section>`;document.querySelector('#start-course').on function breakPage(){app.innerHTML=`<section class="break"><p class="chip">自主休息站 · 2—3分钟</p><h1>城市小休息</h1><p class="lead">可以喝口水、看看远处或伸伸手。准备好了再继续，没有倒计时。</p><div class="stretch"><div><span>🙆</span>伸伸手臂</div><div><span>👀</span>看看远处</div><div><span>💧</span>喝口水</div></div><button id="continue-break" class="primary">准备好了，继续挑战</button></section>`;document.querySelector('#continue-break').onclick=()=>{state.breakCompleted=true;advance()}}
