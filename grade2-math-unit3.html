<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bd3d52">
  <title>小小店长｜人民币与购物</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #30272b;
      --muted: #6f6066;
      --paper: #fffdf8;
      --berry: #bd3d52;
      --berry-dark: #85283c;
      --green: #24745b;
      --mint: #dff5e9;
      --gold: #f5b83b;
      --gold-pale: #fff3c9;
      --blue: #2d70b3;
      --line: #ead8da;
      --shadow: 0 18px 50px rgba(86, 36, 48, .15);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: #f6eadf; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font: 19px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(245, 184, 59, .35) 0 8%, transparent 8.5%),
        radial-gradient(circle at 90% 12%, rgba(120, 211, 169, .3) 0 11%, transparent 11.5%),
        linear-gradient(145deg, #fff7e8 0%, #f7edf1 50%, #eaf7f1 100%);
    }

    button, input { font: inherit; }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:focus-visible, input:focus-visible, [tabindex]:focus-visible, summary:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 4px;
    }
    button:disabled { cursor: not-allowed; opacity: .48; }

    .app-shell { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 18px 0 42px; }
    .topbar {
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
      padding: 12px 16px;
      border: 1px solid rgba(133, 40, 60, .12);
      border-radius: 20px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 8px 24px rgba(86, 36, 48, .09);
      backdrop-filter: blur(12px);
    }
    .brand { color: var(--berry-dark); font-weight: 950; white-space: nowrap; }
    .progress-track { height: 14px; overflow: hidden; border-radius: 999px; background: #eedfe2; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--berry), var(--gold)); transition: width .35s ease; }
    .toolbar-actions { display: flex; gap: 8px; }
    .compact-button { padding: 8px 13px; color: var(--berry-dark); background: #f8e8eb; font-weight: 900; }

    .card {
      min-height: 660px;
      padding: clamp(24px, 4vw, 52px);
      border: 1px solid rgba(133, 40, 60, .11);
      border-radius: 32px;
      background: rgba(255, 253, 248, .97);
      box-shadow: var(--shadow);
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 16px; color: #712039; font-size: clamp(2rem, 5.2vw, 3.45rem); line-height: 1.15; }
    h2, h3 { color: #7b2b42; }
    .hero { max-width: 920px; margin: 0 auto; text-align: center; }
    .market-mark { font-size: clamp(76px, 12vw, 124px); line-height: 1; filter: drop-shadow(0 10px 12px rgba(105, 43, 56, .15)); }
    .lead { max-width: 780px; margin-right: auto; margin-left: auto; color: var(--muted); font-size: 1.14rem; }
    .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 24px 0; }
    .fact { display: inline-flex; min-height: 42px; align-items: center; padding: 6px 14px; border-radius: 999px; color: #6d2940; background: #f9e9ec; font-weight: 850; }
    .route { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 28px 0; text-align: left; }
    .route-stop { min-height: 100px; padding: 14px; border: 2px solid #eedcdf; border-radius: 20px; background: white; }
    .route-stop strong { display: block; color: #7b2b42; }
    .route-stop small { color: var(--muted); }

    .primary-button, .secondary-button, .tool-button { padding: 12px 24px; font-weight: 950; box-shadow: 0 8px 18px rgba(101, 38, 53, .13); }
    .primary-button { color: white; background: linear-gradient(135deg, var(--berry), #9b2f63); }
    .secondary-button { color: #533300; background: var(--gold); }
    .tool-button { color: #6c2940; background: #f7e8eb; }
    .action-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .lesson-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
    .phase-chip, .activity-count { display: inline-flex; min-height: 40px; align-items: center; padding: 5px 13px; border-radius: 999px; font-weight: 900; }
    .phase-chip { color: #752941; background: #f9e9ec; }
    .activity-count { color: #185a46; background: #e0f5eb; }
    .prompt { max-width: 860px; font-size: clamp(1.7rem, 4vw, 2.65rem); }
    .instruction { max-width: 800px; color: var(--muted); font-size: 1.08rem; }

    .money-board { margin: 24px 0; padding: 20px; border: 3px solid #ecd8dc; border-radius: 24px; background: #fff9fa; }
    .money-board h2 { margin-bottom: 8px; }
    .coin-bank, .wallet, .choice-grid, .product-grid { display: grid; gap: 12px; }
    .coin-bank { grid-template-columns: repeat(5, minmax(92px, 1fr)); margin: 16px 0; }
    .coin-button {
      min-height: 76px;
      padding: 10px;
      border: 3px solid #ddbfc5;
      color: #6f263d;
      background: white;
      font-weight: 950;
    }
    .coin-button:hover { border-color: var(--berry); background: #fff0f2; }
    .coin-button .coin-icon { display: block; font-size: 1.45rem; }
    .wallet {
      grid-template-columns: minmax(130px, 1fr) minmax(130px, 1fr);
      align-items: stretch;
      margin-top: 16px;
    }
    .wallet-pocket { min-height: 110px; padding: 16px; border: 3px dashed #d7aa72; border-radius: 20px; background: #fff7df; }
    .wallet-total { display: grid; place-items: center; min-height: 110px; padding: 16px; border-radius: 20px; color: #1b5e48; background: var(--mint); text-align: center; font-size: 1.25rem; font-weight: 950; }
    .money-chip { display: inline-flex; margin: 3px; padding: 5px 9px; border: 2px solid #d4a84e; border-radius: 999px; background: #fff4c4; font-weight: 850; }

    .price-scene { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin: 20px 0; padding: 18px; border: 3px solid #b6dfcc; border-radius: 22px; background: #effbf5; }
    .scene-icon { font-size: 3.2rem; }
    .price-tag { display: inline-flex; min-height: 48px; align-items: center; padding: 7px 15px; border-radius: 12px; color: white; background: var(--berry); font-weight: 950; }
    .expression { width: min(660px, 100%); margin: 20px auto; padding: 18px; border: 3px solid #ead5da; border-radius: 22px; color: #712039; background: #fff8f9; text-align: center; font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 950; }
    .answer-area { margin: 24px 0; }
    .choice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .answer-option, .explore-option, .product-card { min-height: 64px; padding: 14px; border: 3px solid #e6d2d6; color: #6d2940; background: white; font-weight: 900; }
    .answer-option:hover, .explore-option:hover, .product-card:hover { border-color: #c76879; background: #fff7f8; }
    .answer-option.selected, .explore-option.selected, .product-card.selected { border-color: var(--berry); background: #fbe7eb; box-shadow: inset 0 0 0 2px var(--berry); }
    .number-entry { display: grid; gap: 14px; justify-items: center; }
    .answer-input { width: min(280px, 100%); min-height: 64px; padding: 8px 16px; border: 4px solid #d9b8c0; border-radius: 18px; color: #6f2038; background: white; text-align: center; font-size: 2rem; font-weight: 950; }
    .unit-label { color: var(--muted); font-weight: 850; }

    .feedback { margin: 22px 0; padding: 20px; border-radius: 22px; }
    .feedback.success { border: 3px solid #7ec7a6; background: #e8f8ef; }
    .feedback.hint { border: 3px solid #e7bb55; background: #fff6d7; }
    .feedback.misconception { border: 3px solid #e6a08f; background: #fff0eb; }
    .feedback h2 { margin-bottom: 6px; }
    .visual-hint { margin-top: 14px; padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, .72); }
    .exchange-model { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; justify-content: center; font-size: 1.1rem; }
    .exchange-arrow { padding: 0 8px; color: var(--berry-dark); font-size: 1.8rem; font-weight: 950; }

    .break-card { max-width: 720px; margin: 28px auto; text-align: center; }
    .stretch-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 26px 0; }
    .stretch-step { padding: 18px 12px; border-radius: 22px; background: #e7f6ee; }
    .stretch-step span { display: block; font-size: 2.4rem; }

    .report-title { text-align: center; }
    .report-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 26px 0; }
    .skill-card { padding: 20px; border: 2px solid #ead7db; border-radius: 22px; background: white; }
    .skill-icon { font-size: 2.2rem; }
    .status-pill { display: inline-flex; min-height: 38px; align-items: center; padding: 4px 11px; border-radius: 999px; color: #6e2940; background: #f8e9ec; font-weight: 900; }
    .parent-panel { margin-top: 28px; padding: 18px; border: 2px solid #e5d5d8; border-radius: 20px; background: #fffbfc; }
    .parent-panel summary { cursor: pointer; color: #772b42; font-weight: 950; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: 11px; border-bottom: 1px solid #eadcdf; text-align: left; vertical-align: top; }
    th { color: #71283e; background: #f9e9ec; }

    .dialog-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: rgba(49, 28, 34, .65); }
    .dialog-card { width: min(520px, 100%); padding: 28px; border-radius: 26px; background: white; box-shadow: var(--shadow); }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 24; max-width: min(420px, calc(100% - 36px)); padding: 13px 18px; border-radius: 15px; color: white; background: #5f2437; box-shadow: var(--shadow); font-weight: 850; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 620px) {
      .app-shell { width: min(100% - 16px, 1120px); padding-top: 8px; }
      .topbar { grid-template-columns: 1fr auto; gap: 9px; padding: 9px; }
      .progress-track { grid-column: 1 / -1; grid-row: 2; }
      .button-label { display: none; }
      .card { min-height: calc(100vh - 118px); padding: 22px 16px; border-radius: 22px; }
      .route, .choice-grid, .report-grid, .stretch-steps, .wallet { grid-template-columns: 1fr; }
      .route-stop { min-height: auto; }
      .coin-bank { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .coin-button { min-width: 0; }
      .lesson-header { align-items: flex-start; }
      table { min-width: 720px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="课程工具栏">
      <div class="brand">🛒 小小店长</div>
      <div class="progress-track" aria-label="课程进度">
        <div id="progress-bar" class="progress-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
      <div class="toolbar-actions">
        <button id="speech-button" class="compact-button" type="button" aria-label="朗读当前内容">🔊<span class="button-label"> 朗读</span></button>
        <button id="pause-button" class="compact-button" type="button" aria-label="暂停并返回首页" hidden>⏸️<span class="button-label"> 暂停</span></button>
      </div>
    </header>

    <main id="app" class="card">
      <section class="hero" aria-labelledby="course-title">
        <div class="market-mark" aria-hidden="true">🏪</div>
        <p class="fact">二年级数学 · 新知识预习</p>
        <h1 id="course-title">小小店长</h1>
        <p class="lead">认识人民币、学会付款和找零，再用预算解决真正的购物问题。</p>
        <button id="start-course" class="primary-button" type="button">开始营业 🛒</button>
      </section>
    </main>
    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script>
    'use strict';

    /* TESTABLE_CORE_START */
    const PHASES = {
      moneySense: { title: '钱币认识站', minutes: 7, icon: '🪙' },
      composition: { title: '金额组合屋', minutes: 8, icon: '👛' },
      comparison: { title: '价格比较台', minutes: 6, icon: '⚖️' },
      payment: { title: '开心付款柜', minutes: 10, icon: '🧾' },
      break: { title: '伸展休息站', minutes: 2, icon: '🌿' },
      change: { title: '找零训练营', minutes: 10, icon: '🔁' },
      budget: { title: '预算挑战区', minutes: 7, icon: '🧺' },
      application: { title: '生活购物街', minutes: 7, icon: '🏪' },
      report: { title: '店长成长报告', minutes: 3, icon: '🏆' }
    };

    const DENOMINATIONS = [10, 50, 100, 500, 1000];

    const EXPLORATIONS = [
      {
        id: 'explore-recognize-money', phase: 'moneySense', type: 'choice', title: '找到5角人民币',
        instruction: '看清单位，选出面额是5角的钱币。正反面不同，面额不变。', answer: 50,
        options: [{ value: 10, label: '1角' }, { value: 50, label: '5角' }, { value: 100, label: '1元' }],
        success: '5角就是50分。人民币正反面的图案不同，但面额不变。'
      },
      {
        id: 'explore-exchange-jiao', phase: 'moneySense', type: 'wallet', title: '把10角换成1元',
        instruction: '点击10次“1角”，凑到1元。', targetFen: 100, denominations: [10],
        success: '10角和1元一样多，也就是100分。'
      },
      {
        id: 'explore-compose-160', phase: 'composition', type: 'wallet', title: '钱包里凑出1元6角',
        instruction: '用钱币按钮凑出1元6角，可以试试1元、5角和1角。', targetFen: 160, denominations: DENOMINATIONS,
        success: '1元＋5角＋1角＝1元6角。不同钱币可以组成同一个金额。'
      },
      {
        id: 'explore-same-amount', phase: 'composition', type: 'wallet', title: '换一种方法凑2元',
        instruction: '不用2枚1元，试着用5角凑出2元。', targetFen: 200, denominations: [50],
        success: '4枚5角也是2元，同一个金额可以有不同付法。'
      },
      {
        id: 'explore-compare-units', phase: 'comparison', type: 'choice', title: '8角和1元谁更多',
        instruction: '先把1元换成10角，再选择比较结果。', answer: '1元更多',
        options: [{ value: '8角更多', label: '8角更多' }, { value: '一样多', label: '一样多' }, { value: '1元更多', label: '1元更多' }],
        success: '1元＝10角，10角比8角多，所以1元更多。'
      },
      {
        id: 'explore-exact-payment', phase: 'payment', type: 'wallet', title: '恰好付3元5角',
        instruction: '商品价格是3元5角，请在钱包里恰好付350分。', targetFen: 350, denominations: DENOMINATIONS,
        success: '付款总额和价格一样，就是恰好付款。'
      },
      {
        id: 'explore-check-change', phase: 'change', type: 'choice', title: '用加法检查找零',
        instruction: '商品7元6角，付10元，找2元4角。选出正确的检查方法。', answer: '价格＋找零＝付款',
        options: [{ value: '价格＋找零＝付款', label: '7元6角＋2元4角＝10元' }, { value: '付款＋价格＝找零', label: '10元＋7元6角＝找零' }],
        success: '价格＋找零＝付款，说明找零正确。'
      },
      {
        id: 'explore-budget-basket', phase: 'budget', type: 'choice', title: '10元预算选两件商品',
        instruction: '铅笔3元、橡皮2元、本子6元。选择不超过10元的两件组合。', answer: '铅笔和本子',
        options: [{ value: '铅笔和本子', label: '✏️ 铅笔3元＋📒 本子6元' }, { value: '两本本子', label: '📒 本子6元＋📒 本子6元' }],
        success: '3元＋6元＝9元，没有超过10元预算。'
      }
    ];

    const QUESTION_BANK = [
      {
        id: 'money-01', phase: 'moneySense', dimension: 'moneySense', tags: ['认识币值'], type: 'choice',
        prompt: '下面哪个金额表示5元？', expression: '5元＝？分', answer: 500, options: [50, 500, 5, 100],
        hints: ['先想1元等于多少分。', '1元＝100分，5元就是5个100分。', '5×100＝500，所以5元等于500分。'],
        misconceptionRules: [{ code: 'unit-confusion', answers: [50, 5] }], explanation: '1元是100分，5元就是500分。'
      },
      {
        id: 'money-02', phase: 'moneySense', dimension: 'moneySense', tags: ['元角关系'], type: 'choice',
        prompt: '10角可以换成多少元？', expression: '10角＝？', answer: '1元', options: ['1元', '10元', '1角', '100元'],
        hints: ['回想刚才把10枚1角放进钱包。', '10个1角合起来正好是1元。', '10角＝1元，所以选择1元。'],
        misconceptionRules: [{ code: 'unit-confusion', answers: ['10元', '1角'] }], explanation: '元和角的关系是1元＝10角。'
      },
      {
        id: 'money-03', phase: 'moneySense', dimension: 'moneySense', tags: ['角分关系'], type: 'choice',
        prompt: '1角等于多少分？', expression: '1角＝？分', answer: 10, options: [1, 5, 10, 100],
        hints: ['想一想角和分之间也是“满十换一”。', '10个1分可以换成1角。', '1角＝10分，所以选10。'],
        misconceptionRules: [{ code: 'unit-confusion', answers: [1, 100] }], explanation: '角和分的关系是1角＝10分。'
      },
      {
        id: 'money-04', phase: 'moneySense', dimension: 'moneySense', tags: ['金额换算'], type: 'number-input',
        prompt: '3元5角一共是多少分？', expression: '3元5角＝？分', answer: 350, unit: '分',
        hints: ['先把3元换成分，再加上5角。', '3元＝300分，5角＝50分。', '300＋50＝350，所以是350分。'],
        misconceptionRules: [{ code: 'ignored-unit', answers: [35] }, { code: 'unit-confusion', answers: [305] }], explanation: '3元是300分，5角是50分，合起来350分。'
      },
      {
        id: 'compose-01', phase: 'composition', dimension: 'composition', tags: ['组成金额'], type: 'wallet',
        prompt: '请在钱包里凑出1元6角。', expression: '目标：1元6角', answer: 160,
        hints: ['先放1元，还差几角？', '1元6角是160分；放1元后还差60分。', '放1元、5角和1角，100＋50＋10＝160分。'],
        misconceptionRules: [{ code: 'underpayment', when: 'underpayment' }], explanation: '所选钱币总额是160分，正好等于1元6角。'
      },
      {
        id: 'compose-02', phase: 'composition', dimension: 'composition', tags: ['等值组成'], type: 'choice',
        prompt: '哪组钱和2元一样多？', expression: '2元＝？', answer: '4枚5角', options: ['2枚5角', '4枚5角', '1枚5角和1枚1角', '10枚1角'],
        hints: ['先把2元换成角。', '2元＝20角，每枚5角。', '4×5角＝20角＝2元，所以选4枚5角。'],
        misconceptionRules: [{ code: 'unit-confusion', answers: ['2枚5角', '10枚1角'] }], explanation: '4枚5角一共20角，也就是2元。'
      },
      {
        id: 'compare-01', phase: 'comparison', dimension: 'composition', tags: ['比较金额'], type: 'choice',
        prompt: '8角和1元，哪个金额更大？', expression: '8角 ○ 1元', answer: '1元更大', options: ['8角更大', '一样大', '1元更大'],
        hints: ['先统一成“角”再比较。', '1元＝10角，现在比较8和10。', '10角比8角大，所以1元更大。'],
        misconceptionRules: [{ code: 'ignored-unit', answers: ['8角更大'] }], explanation: '统一单位后，8角小于10角，所以1元更大。'
      },
      {
        id: 'compare-02', phase: 'comparison', dimension: 'composition', tags: ['统一单位'], type: 'choice',
        prompt: '2元5角和25角相比，结果是什么？', expression: '2元5角 ○ 25角', answer: '一样多', options: ['2元5角更多', '一样多', '25角更多'],
        hints: ['把2元先换成角。', '2元是20角，再加5角就是25角。', '2元5角＝25角，所以一样多。'],
        misconceptionRules: [{ code: 'ignored-unit', answers: ['25角更多'] }], explanation: '2元5角就是25角，两个金额相等。'
      },
      {

    function requireMoneyInteger(value, label) {
      if (!Number.isInteger(value) || value < 0) throw new Error(`${label}必须是非负整数`);
      return value;
    }

    function toFen(yuan, jiao, fen) {
      return requireMoneyInteger(yuan, '元') * 100
        + requireMoneyInteger(jiao, '角') * 10
        + requireMoneyInteger(fen, '分');
    }

    function composeAmount(denominations) {
      if (!Array.isArray(denominations)) throw new Error('币值必须放在数组中');
      return denominations.reduce((sum, denomination) => sum + requireMoneyInteger(denomination, '币值'), 0);
    }

    function calculateChange(paidFen, priceFen) {
      requireMoneyInteger(paidFen, '付款金额');
      requireMoneyInteger(priceFen, '价格');
      if (paidFen < priceFen) return { ok: false, changeFen: null };
      return { ok: true, changeFen: paidFen - priceFen };
    }

    function evaluateAnswer(question, answer) {
      if (answer === null || answer === undefined) return false;
      if (question.type === 'wallet') {
        if (!Array.isArray(answer)) return false;
        try { return composeAmount(answer) === question.answer; } catch (_error) { return false; }
      }
      if (String(answer).trim() === '') return false;
      if (typeof question.answer === 'number') return Number(answer) === question.answer;
      return String(answer).trim() === String(question.answer);
    }

    function getHint(question, requestedLevel) {
      const level = Math.min(Math.max(Number(requestedLevel) || 1, 1), 3);
      return { level, text: question.hints[level - 1] };
    }

    function detectMisconception(question, answer, context = {}) {
      if (answer === null || answer === undefined || String(answer).trim() === '') return null;
      const rules = Array.isArray(question.misconceptionRules) ? question.misconceptionRules : [];
      for (const rule of rules) {
        if (rule.when === 'underpayment' && context.underpayment === true) return rule.code;
        if (rule.when === 'overBudget' && context.overBudget === true) return rule.code;
        if (Array.isArray(rule.answers) && rule.answers.some((candidate) => String(candidate) === String(answer).trim())) return rule.code;
      }
      return null;
    }

    function buildActivityQueue() {
      const exploration = (id) => {
        const item = EXPLORATIONS.find((candidate) => candidate.id === id);
        return { kind: 'exploration', id, phase: item.phase };
      };
      const question = (id) => {
        const item = QUESTION_BANK.find((candidate) => candidate.id === id);
        return { kind: 'question', id, phase: item.phase };
      };
      return [
        exploration('explore-recognize-money'), question('money-01'), question('money-02'),
        exploration('explore-exchange-jiao'), question('money-03'), question('money-04'),
        exploration('explore-compose-160'), question('compose-01'),
        exploration('explore-same-amount'), question('compose-02'),
        exploration('explore-compare-units'), question('compare-01'), question('compare-02'),
        exploration('explore-exact-payment'), question('pay-01'), question('pay-02'), question('pay-03'),
        { kind: 'break', id: 'mid-course-break', phase: 'break' },
        exploration('explore-check-change'), question('change-01'), question('change-02'), question('change-03'),
        exploration('explore-budget-basket'), question('budget-01'), question('budget-02'), question('budget-03'),
        question('application-01'), question('application-02'), question('application-03')
      ];
    }

    const DIMENSION_KEYS = ['moneySense', 'composition', 'payment', 'application'];

    function buildReport(records, questionBank = QUESTION_BANK) {
      const safeBank = Array.isArray(questionBank) ? questionBank : [];
      const knownIds = new Set(safeBank.map((question) => question.id));
      const safeRecords = Array.isArray(records) ? records.filter((record) => record && knownIds.has(record.questionId)) : [];
      const dimensions = {};
      for (const dimension of DIMENSION_KEYS) {
        const planned = safeBank.filter((question) => question.dimension === dimension);
        const answered = safeRecords.filter((record) => planned.some((question) => question.id === record.questionId));
        dimensions[dimension] = {
          total: planned.length,
          answered: answered.length,
          independent: answered.filter((record) => record.firstCorrect && record.firstHintLevel === 0).length,
          supported: answered.filter((record) => record.firstCorrect && record.firstHintLevel > 0).length
        };
      }

      const misconceptions = {};
      for (const record of safeRecords) {
        if (!record.firstMisconception) continue;
        misconceptions[record.firstMisconception] = (misconceptions[record.firstMisconception] || 0) + 1;
      }

      const hintUsage = { none: 0, level1: 0, level2: 0, level3: 0 };
      for (const record of safeRecords) {
        const level = Number(record.firstHintLevel) || 0;
        if (level === 0) hintUsage.none += 1;
        else hintUsage[`level${Math.min(level, 3)}`] += 1;
      }

      const independentCorrect = safeRecords.filter((record) => record.firstCorrect && record.firstHintLevel === 0).length;
      const supportedCorrect = safeRecords.filter((record) => record.firstCorrect && record.firstHintLevel > 0).length;
      const wrongQuestionIds = safeRecords.filter((record) => !record.firstCorrect).map((record) => record.questionId);
      const unansweredIds = safeBank.filter((question) => !safeRecords.some((record) => record.questionId === question.id)).map((question) => question.id);
      const retryRecovery = safeRecords.filter((record) => !record.firstCorrect && record.retry?.correct === true).length;
      const strongest = DIMENSION_KEYS
        .map((key) => ({ key, score: dimensions[key].independent, answered: dimensions[key].answered }))
        .filter((item) => item.answered > 0)
        .sort((a, b) => b.score - a.score)[0];
      return {
        dimensions,
        independentCorrect,
        supportedCorrect,
        misconceptions,
        hintUsage,
        retryRecovery,
        wrongQuestionIds,
        unansweredIds,
        strengths: strongest ? [`${strongest.key}维度的独立完成证据最多`] : ['还没有完成正式题'],
        nextSteps: wrongQuestionIds.length ? ['用真实钱币重做一题', '说出单位统一和验算步骤'] : ['在生活购物时主动估算和检查']
      };
    }

    function createInitialState() {
      return {
        version: 1,
        screen: 'home',
        activityIndex: 0,
        completedExplorations: [],
        records: [],
        mode: 'course',
        retryQueue: [],

        current: {
          attempts: 0,
          maxHintLevel: 0,
          selectedAnswer: null,
          firstHintLevel: null,
          lastMisconception: null,
          resolved: false,

    function validAnswerValue(value) {
      return value === null || ['string', 'number'].includes(typeof value)
        || (Array.isArray(value) && value.every((item) => Number.isInteger(item) && DENOMINATIONS.includes(item)));
    }

    function validRecord(record) {
      const questionIds = new Set(QUESTION_BANK.map((question) => question.id));
      if (!record || !questionIds.has(record.questionId) || !validAnswerValue(record.firstAnswer)) return false;
      if (typeof record.firstCorrect !== 'boolean') return false;
      if (!Number.isInteger(record.firstHintLevel) || record.firstHintLevel < 0 || record.firstHintLevel > 3) return false;
      if (!(record.firstMisconception === null || typeof record.firstMisconception === 'string')) return false;
      if (!Number.isInteger(record.attempts) || record.attempts < 1) return false;
      if (!Number.isInteger(record.maxHintLevel) || record.maxHintLevel < record.firstHintLevel || record.maxHintLevel > 3) return false;
      if (typeof record.resolved !== 'boolean') return false;
      if (!(record.retry === null || (record.retry && validAnswerValue(record.retry.answer) && typeof record.retry.correct === 'boolean'))) return false;
      return true;
    }

    function validateSave(value) {
      if (!value || typeof value !== 'object' || value.version !== 1) return false;
      const queueLength = buildActivityQueue().length;
      const questionIds = new Set(QUESTION_BANK.map((question) => question.id));
      const explorationIds = new Set(EXPLORATIONS.map((exploration) => exploration.id));
      if (!['home', 'activity', 'report'].includes(value.screen)) return false;
      if (!Number.isInteger(value.activityIndex) || value.activityIndex < 0 || value.activityIndex > queueLength) return false;
      if (!Array.isArray(value.completedExplorations) || !value.completedExplorations.every((id) => explorationIds.has(id)) || new Set(value.completedExplorations).size !== value.completedExplorations.length) return false;
      if (!Array.isArray(value.records) || !value.records.every(validRecord) || new Set(value.records.map((record) => record.questionId)).size !== value.records.length) return false;
      if (!['course', 'retry'].includes(value.mode)) return false;
      if (!Array.isArray(value.retryQueue) || !value.retryQueue.every((id) => questionIds.has(id)) || new Set(value.retryQueue).size !== value.retryQueue.length) return false;
      if (!Number.isInteger(value.retryIndex) || value.retryIndex < 0 || value.retryIndex > value.retryQueue.length) return false;
      const current = value.current;
      if (!current || typeof current !== 'object') return false;
      if (!Number.isInteger(current.attempts) || current.attempts < 0) return false;
      if (!Number.isInteger(current.maxHintLevel) || current.maxHintLevel < 0 || current.maxHintLevel > 3) return false;
      if (!validAnswerValue(current.selectedAnswer)) return false;
      if (!(current.firstHintLevel === null || (Number.isInteger(current.firstHintLevel) && current.firstHintLevel >= 1 && current.firstHintLevel <= 3))) return false;
      if (!(current.lastMisconception === null || typeof current.lastMisconception === 'string')) return false;
      if (typeof current.resolved !== 'boolean') return false;
      if (!Array.isArray(current.walletSelection) || !current.walletSelection.every((item) => DENOMINATIONS.includes(item))) return false;
      if (value.screen === 'report') {
        if (value.activityIndex !== queueLength || value.completedExplorations.length !== EXPLORATIONS.length || value.records.length !== QUESTION_BANK.length) return false;
        if (!value.records.every((record) => record.resolved)) return false;
      }
      return true;
    }

    window.MoneyMarketTestHooks = {

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function formatFen(fen) {
      const amount = Number(fen) || 0;
      const yuan = Math.floor(amount / 100);
      const remainder = amount % 100;
      const jiao = Math.floor(remainder / 10);
      const smallFen = remainder % 10;
      const parts = [];
      if (yuan) parts.push(`${yuan}元`);
      if (jiao) parts.push(`${jiao}角`);
      if (smallFen) parts.push(`${smallFen}分`);
      return parts.join('') || '0分';
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const value = JSON.parse(raw);
        if (validateSave(value)) return value;
        localStorage.removeItem(SAVE_KEY);
        return null;
      } catch (_error) {
        try { localStorage.removeItem(SAVE_KEY); } catch (_ignored) {}
        return null;
      }
    }

    function saveProgress() {
      if (!validateSave(state)) return;
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
      catch (_error) { showToast('浏览器暂时无法保存进度，请保持本页打开。'); }
    }

    function clearProgress() {
      localStorage.removeItem(SAVE_KEY);
    }

    let state = loadProgress() || createInitialState();

    function currentActivity() {
      if (state.mode === 'retry') {
        const id = state.retryQueue[state.retryIndex];
        const question = QUESTION_BANK.find((item) => item.id === id);
        return question ? { kind: 'question', id, phase: question.phase } : null;
      }
      return COURSE_QUEUE[state.activityIndex] || null;
    }

    function currentQuestion() {
      const activity = currentActivity();
      return activity?.kind === 'question' ? QUESTION_BANK.find((item) => item.id === activity.id) || null : null;
    }

    function currentExploration() {
      const activity = currentActivity();
      return activity?.kind === 'exploration' ? EXPLORATIONS.find((item) => item.id === activity.id) || null : null;
    }

    function progressPercent() {
      if (state.screen === 'report') return 100;
      if (state.mode === 'retry') return state.retryQueue.length ? Math.round((state.retryIndex / state.retryQueue.length) * 100) : 0;
      return Math.round((state.activityIndex / COURSE_QUEUE.length) * 100);
    }

        <h1 id="course-title">小小店长</h1>
        <p class="lead">认识人民币、学会付款和找零，再用预算解决真正的购物问题。</p>
        <div class="facts"><span class="fact">⏱️ 建议60分钟</span><span class="fact">🧩 8个点击探索</span><span class="fact">✏️ 20道固定练习</span><span class="fact">🌿 中途可休息</span></div>
        <div class="route" aria-label="课程路线">
          <div class="route-stop"><strong>🪙 钱币认识站</strong><small>元、角、分和换算</small></div>
          <div class="route-stop"><strong>👛 金额组合屋</strong><small>多种钱币组成同额</small></div>
          <div class="route-stop"><strong>⚖️ 价格比较台</strong><small>统一单位再比较</small></div>
          <div class="route-stop"><strong>🧾 开心付款柜</strong><small>恰好付款和够不够</small></div>
          <div class="route-stop"><strong>🔁 找零训练营</strong><small>减法找零、加法检查</small></div>
          <div class="route-stop"><strong>🧺 生活购物街</strong><small>预算、总价和剩余</small></div>
        </div>
        <p class="instruction">60分钟只是建议节奏，不倒计时。累了可以随时暂停，下次从原处继续。</p>
        <div class="action-row" style="justify-content:center"><button id="start-course" class="primary-button" type="button">${label}</button>${hasProgress ? '<button id="home-restart" class="tool-button" type="button">重新开始</button>' : ''}</div>
      </section>`;
      document.getElementById('start-course').addEventListener('click', () => {
        if (state.screen === 'report') renderReport();
        else { state.screen = 'activity'; saveProgress(); renderCurrent(); }
      });
      document.getElementById('home-restart')?.addEventListener('click', openRestartDialog);
    }

    function moneyButtons(denominations = DENOMINATIONS) {
      return `<div class="coin-bank" aria-label="虚拟钱包钱币按钮">${denominations.map((fen) => `<button class="coin-button" type="button" data-coin="${fen}" aria-label="添加${formatFen(fen)}"><span class="coin-icon" aria-hidden="true">${fen >= 100 ? '💵' : '🪙'}</span>${formatFen(fen)}</button>`).join('')}</div>`;
    }

    function walletPanel(targetFen) {
      const total = composeAmount(state.current.walletSelection);
      return `<div class="money-board"><h2>点击钱币放进钱包</h2>${moneyButtons()}
        <div class="wallet"><div class="wallet-pocket" aria-label="钱包里有${formatFen(total)}">${state.current.walletSelection.length ? state.current.walletSelection.map((fen) => `<span class="money-chip">${formatFen(fen)}</span>`).join('') : '钱包还是空的'}</div>
        <div class="wallet-total"><span>现在共有</span><strong>${formatFen(total)}</strong>${targetFen !== undefined ? `<small>目标 ${formatFen(targetFen)}</small>` : ''}</div></div>
        <div class="action-row"><button id="clear-wallet" class="tool-button" type="button">清空钱包</button></div></div>`;
    }

    function wireWallet(onChange) {
      document.querySelectorAll('[data-coin]').forEach((button) => button.addEventListener('click', () => {
        state.current.walletSelection.push(Number(button.dataset.coin));
        saveProgress();
        onChange();
        announce(`已添加${formatFen(Number(button.dataset.coin))}，钱包共有${formatFen(composeAmount(state.current.walletSelection))}。`);
      }));
      document.getElementById('clear-wallet')?.addEventListener('click', () => {
        state.current.walletSelection = [];
        saveProgress();
        onChange();
        announce('钱包已经清空。');
      });
    }

    function renderExploreControl(exploration) {
      if (exploration.type === 'wallet') return walletPanel(exploration.targetFen).replace(moneyButtons(), moneyButtons(exploration.denominations || DENOMINATIONS));
      return `<div class="choice-grid" role="group" aria-label="请选择一种做法">${exploration.options.map((option, index) => `<button class="explore-option${String(state.current.selectedAnswer) === String(option.value) ? ' selected' : ''}" type="button" data-explore-option="${index}" aria-pressed="${String(state.current.selectedAnswer) === String(option.value)}">${escapeHtml(option.label)}</button>`).join('')}</div>`;
    }

    function renderExploration(exploration) {
      const number = EXPLORATIONS.findIndex((item) => item.id === exploration.id) + 1;
      app.innerHTML = `<section aria-labelledby="exploration-heading"><div class="lesson-header"><span class="phase-chip">${PHASES[exploration.phase].icon} ${escapeHtml(PHASES[exploration.phase].title)}</span><span class="activity-count">探索 ${number} / 8</span></div>
        <h1 id="exploration-heading" class="prompt" tabindex="-1">${escapeHtml(exploration.title)}</h1><p class="instruction">${escapeHtml(exploration.instruction)}</p>
        ${state.current.resolved ? `<div class="feedback success" role="status"><h2>🎉 探索成功！</h2><p>${escapeHtml(exploration.success)}</p></div><div class="action-row"><button id="next-activity" class="primary-button" type="button">继续购物 ➜</button></div>` : `${renderExploreControl(exploration)}${state.current.lastMisconception ? '<div class="feedback misconception" role="status">再检查一次金额或单位。</div>' : ''}<div class="action-row"><button id="do-exploration" class="secondary-button" type="button">检查我的发现</button></div>`}
      </section>`;
      if (!state.current.resolved) {
        if (exploration.type === 'wallet') wireWallet(() => renderExploration(exploration));
        else document.querySelectorAll('[data-explore-option]').forEach((button) => button.addEventListener('click', () => {
          state.current.selectedAnswer = exploration.options[Number(button.dataset.exploreOption)].value;
          saveProgress(); renderExploration(exploration);
        }));
        document.getElementById('do-exploration').addEventListener('click', () => {
          const correct = exploration.type === 'wallet'
            ? composeAmount(state.current.walletSelection) === exploration.targetFen
            : String(state.current.selectedAnswer) === String(exploration.answer);
          if (!correct) { state.current.lastMisconception = 'try-again'; saveProgress(); renderExploration(exploration); announce('还差一点，再看看目标金额和单位。'); return; }
          state.current.resolved = true;
          state.current.lastMisconception = null;
          if (!state.completedExplorations.includes(exploration.id)) state.completedExplorations.push(exploration.id);
          saveProgress(); renderExploration(exploration); announce(`探索成功。${exploration.success}`);
        });
      }
      document.getElementById('next-activity')?.addEventListener('click', moveNext);
      focusHeading('exploration-heading');
    }

    function questionScene(question) {
      const icon = question.phase === 'moneySense' ? '🪙' : question.phase === 'composition' ? '👛' : question.phase === 'comparison' ? '⚖️' : question.phase === 'payment' ? '🧾' : question.phase === 'change' ? '🔁' : question.phase === 'budget' ? '🧺' : '🏪';
      return `<div class="price-scene"><span class="scene-icon" aria-hidden="true">${icon}</span><div><strong>${escapeHtml(PHASES[question.phase].title)}</strong><p>金额统一用整数“分”计算，显示时再换回元、角、分。</p></div>${typeof question.answer === 'number' ? `<span class="price-tag">目标 ${formatFen(question.answer)}</span>` : ''}</div>`;
    }

    function renderAnswerControl(question) {
      if (question.type === 'wallet') return walletPanel(question.answer);
      if (question.type === 'number-input') return `<div class="number-entry"><label for="number-answer">输入答案${question.unit ? `（${escapeHtml(question.unit)}）` : ''}</label><input id="number-answer" class="answer-input" type="text" inputmode="numeric" autocomplete="off" maxlength="5" value="${state.current.selectedAnswer ?? ''}"><span class="unit-label">只填数字，单位是${escapeHtml(question.unit || '分')}</span></div>`;
      return `<div class="choice-grid" role="group" aria-label="请选择一个答案">${question.options.map((option, index) => `<button class="answer-option${String(state.current.selectedAnswer) === String(option) ? ' selected' : ''}" type="button" data-option-index="${index}" aria-pressed="${String(state.current.selectedAnswer) === String(option)}">${escapeHtml(option)}</button>`).join('')}</div>`;
    }

    function renderHint(question) {
      if (!state.current.maxHintLevel) return '';
      const hint = getHint(question, state.current.maxHintLevel);
      const titles = { 1: '💡 先找方向', 2: '🧩 画成模型', 3: '🪄 完整方法' };
      return `${state.current.lastMisconception ? misconceptionFeedback(state.current.lastMisconception) : ''}<aside class="feedback hint" role="status" aria-live="polite"><h2>${titles[hint.level]}</h2><p>${escapeHtml(hint.text)}</p>${hint.level >= 2 ? `<div class="visual-hint"><div class="exchange-model"><span>1元</span><span class="exchange-arrow">＝</span><span>10角</span><span class="exchange-arrow">＝</span><span>100分</span></div>${hint.level === 3 ? `<p><strong>${escapeHtml(question.explanation)}</strong></p>` : ''}</div>` : ''}</aside>`;
    }

    function misconceptionFeedback(code) {
      const copy = MISCONCEPTION_COPY[code];
      return copy ? `<div class="feedback misconception" role="status"><strong>🔎 找到问题：</strong> ${escapeHtml(copy.feedback)}</div>` : '';
    }

    function wireAnswerControls(question) {
      const submit = document.getElementById('submit-answer');
      if (question.type === 'wallet') {
        wireWallet(() => renderQuestion(question));
        submit.disabled = state.current.walletSelection.length === 0;
        return;
      }
      if (question.type === 'number-input') {
        const input = document.getElementById('number-answer');
        const sync = () => {
          input.value = input.value.replace(/[^0-9]/g, '').slice(0, 5);
          state.current.selectedAnswer = input.value;
          submit.disabled = input.value.length === 0;
          saveProgress();
        };
        input.addEventListener('input', sync);
        input.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !submit.disabled) submitCurrentAnswer(); });
        submit.disabled = input.value.length === 0;
        return;
      }
      document.querySelectorAll('[data-option-index]').forEach((button) => button.addEventListener('click', () => {
        state.current.selectedAnswer = question.options[Number(button.dataset.optionIndex)];
        saveProgress(); renderQuestion(question);
      }));
      submit.disabled = state.current.selectedAnswer === null;
    }

    function renderQuestion(question) {
      if (state.current.resolved) { renderResolvedQuestion(question); return; }
      const number = QUESTION_BANK.findIndex((item) => item.id === question.id) + 1;
      app.innerHTML = `<section aria-labelledby="question-heading"><div class="lesson-header"><span class="phase-chip">${PHASES[question.phase].icon} ${escapeHtml(PHASES[question.phase].title)}</span><span class="activity-count">${state.mode === 'retry' ? '错题重练' : `练习 ${number} / 20`}</span></div>
        <h1 id="question-heading" class="prompt" tabindex="-1">${escapeHtml(question.prompt)}</h1>${questionScene(question)}<div class="expression">${escapeHtml(question.expression)}</div>
        <div class="answer-area">${renderAnswerControl(question)}</div>${renderHint(question)}
        <div class="action-row"><button id="submit-answer" class="primary-button" type="button">提交答案</button><button id="hint-button" class="tool-button" type="button" ${state.current.maxHintLevel >= 3 ? 'disabled' : ''}>${state.current.maxHintLevel ? '再看一级提示' : '看看提示'}</button></div>
      </section>`;
      wireAnswerControls(question);
      document.getElementById('submit-answer').addEventListener('click', submitCurrentAnswer);
      document.getElementById('hint-button').addEventListener('click', () => {
        const nextLevel = Math.min(state.current.maxHintLevel + 1, 3);
        state.current.maxHintLevel = nextLevel;
        if (state.current.attempts === 0 && state.current.firstHintLevel === null) state.current.firstHintLevel = nextLevel;
        const record = state.records.find((item) => item.questionId === question.id);
        if (record) record.maxHintLevel = Math.max(record.maxHintLevel, nextLevel);
        saveProgress(); renderQuestion(question); announce(`第${nextLevel}级提示：${question.hints[nextLevel - 1]}`);
      });
      focusHeading('question-heading');
    }

    function answerForQuestion(question) {
      return question.type === 'wallet' ? clone(state.current.walletSelection) : state.current.selectedAnswer;
    }

    function submitCurrentAnswer() {
      const question = currentQuestion();
      if (!question) return;
      const answer = answerForQuestion(question);
      if ((question.type === 'wallet' && answer.length === 0) || (question.type !== 'wallet' && (answer === null || String(answer).trim() === ''))) { announce('请先选择、输入或组成一个答案。'); return; }
      state.current.attempts += 1;
      const correct = evaluateAnswer(question, answer);
      const amount = question.type === 'wallet' ? composeAmount(answer) : Number(answer);
      const misconception = correct ? null : detectMisconception(question, answer, {
        underpayment: question.type === 'wallet' && amount < question.answer,
        overBudget: question.phase === 'budget' && amount > question.answer
      });
      if (misconception && !state.current.lastMisconception) state.current.lastMisconception = misconception;

      if (state.mode === 'retry') {
        const original = state.records.find((record) => record.questionId === question.id);
        if (correct && original) original.retry = { answer: clone(answer), correct: true };
      } else {
        let record = state.records.find((item) => item.questionId === question.id);
        if (!record) {
          record = {
            questionId: question.id,
            firstAnswer: clone(answer),
            firstCorrect: correct,
            firstHintLevel: state.current.firstHintLevel ?? 0,
            firstMisconception: misconception,
            attempts: 1,
            maxHintLevel: state.current.maxHintLevel,
            resolved: correct,
            retry: null
          };
          state.records.push(record);
        } else {
          record.attempts = state.current.attempts;
          record.maxHintLevel = Math.max(record.maxHintLevel, state.current.maxHintLevel);
          if (correct) record.resolved = true;
        }
      }

      if (correct) {
        state.current.resolved = true;
        state.current.selectedAnswer = null;
        const record = state.records.find((item) => item.questionId === question.id);
        if (record) { record.attempts = Math.max(record.attempts, state.current.attempts); record.maxHintLevel = Math.max(record.maxHintLevel, state.current.maxHintLevel); record.resolved = true; }
        saveProgress(); renderResolvedQuestion(question); return;
      }

      const hint = getHint(question, state.current.maxHintLevel + 1 || 1);
      state.current.maxHintLevel = Math.max(state.current.maxHintLevel, hint.level);
      const record = state.records.find((item) => item.questionId === question.id);
      if (record) { record.attempts = state.current.attempts; record.maxHintLevel = Math.max(record.maxHintLevel, hint.level); }
      state.current.selectedAnswer = null;
      state.current.walletSelection = [];
      saveProgress(); renderQuestion(question); announce(`再想一想。${hint.text}`);
    }

    function renderResolvedQuestion(question) {
      const final = state.mode === 'retry' ? state.retryIndex >= state.retryQueue.length - 1 : state.activityIndex >= COURSE_QUEUE.length - 1;
      app.innerHTML = `<section aria-labelledby="correct-heading"><div class="lesson-header"><span class="phase-chip">${PHASES[question.phase].icon} ${escapeHtml(PHASES[question.phase].title)}</span><span class="activity-count">完成</span></div><div class="expression">${escapeHtml(question.expression)}</div><div class="feedback success" role="status" aria-live="polite"><h1 id="correct-heading" tabindex="-1">🎉 付款正确！</h1><p>${escapeHtml(question.explanation)}</p></div><div class="action-row"><button id="next-activity" class="primary-button" type="button">${final ? '查看成长报告 🏆' : '继续购物 ➜'}</button></div></section>`;
      document.getElementById('next-activity').addEventListener('click', moveNext);
      focusHeading('correct-heading'); announce(`答对了。${question.explanation}`);
    }

    function renderBreak() {
      app.innerHTML = `<section class="break-card" aria-labelledby="break-heading"><div class="market-mark" aria-hidden="true">🌿</div><p class="phase-chip">开心付款柜完成啦</p><h1 id="break-heading" tabindex="-1">伸展休息站</h1><p class="lead">眼睛和身体也要休息。可以休息约2分钟，准备好了随时继续，不用等待倒计时。</p><div class="stretch-steps"><div class="stretch-step"><span>👀</span>看看远处</div><div class="stretch-step"><span>🙆</span>伸伸手臂</div><div class="stretch-step"><span>🥛</span>喝一口水</div></div><button id="next-activity" class="primary-button" type="button">准备好了，继续 ➜</button></section>`;
      document.getElementById('next-activity').addEventListener('click', moveNext); focusHeading('break-heading');
    }

    function renderCurrent() {
      const activity = currentActivity();
      if (!activity) { finishMode(); return; }
      state.screen = 'activity';
      pauseButton.hidden = false;
      updateToolbar();
      saveProgress();
      if (activity.kind === 'exploration') renderExploration(currentExploration());
      else if (activity.kind === 'question') renderQuestion(currentQuestion());
      else renderBreak();
    }

    function moveNext() {
      if (state.mode === 'retry') {
        state.retryIndex += 1;
        resetCurrent();
        if (state.retryIndex >= state.retryQueue.length) finishMode();
        else { saveProgress(); renderCurrent(); }
        return;
      }
      state.activityIndex += 1;
      resetCurrent();
      if (state.activityIndex >= COURSE_QUEUE.length) finishMode();
      else { saveProgress(); renderCurrent(); }
    }

    function finishMode() {
      if (state.mode === 'retry') { state.mode = 'course'; state.retryIndex = 0; }
      state.activityIndex = COURSE_QUEUE.length;
      state.screen = 'report';
      resetCurrent();
      saveProgress();
      renderReport();
    }

    function dimensionStatus(result) {
      if (!result.answered) return '还没有证据';
      if (result.independent === result.total) return '可以独立完成';
      if (result.independent + result.supported >= Math.ceil(result.total / 2)) return '提示后能完成';
      return '适合再练一练';
    }

    function reportMisconception(code) {
      return MISCONCEPTION_COPY[code]?.report || '—';
    }

    function renderReport() {
      const report = buildReport(state.records, QUESTION_BANK);
      state.screen = 'report'; pauseButton.hidden = true; updateToolbar(); saveProgress();
      app.innerHTML = `<section aria-labelledby="report-heading"><div class="report-title"><div class="market-mark" aria-hidden="true">🏆</div><h1 id="report-heading" tabindex="-1">小小店长毕业啦！</h1><p class="lead">你完成了8个探索和20道固定练习。报告保留第一次证据，重练不会改写它。</p></div>
        <div class="report-grid">${Object.entries(DIMENSIONS).map(([key, meta]) => { const result = report.dimensions[key]; return `<article class="skill-card"><div class="skill-icon" aria-hidden="true">${meta.icon}</div><h3>${meta.title}</h3><p class="status-pill">${dimensionStatus(result)}</p><p>${meta.copy}</p><p>独立首次正确 ${result.independent} / ${result.total}<br>提示支持首次正确 ${result.supported} / ${result.total}</p></article>`; }).join('')}</div>
        <div class="feedback ${report.wrongQuestionIds.length ? 'hint' : 'success'}"><h2>${report.wrongQuestionIds.length ? '🌱 下一步建议' : '🌟 四项能力都很稳'}</h2><p>独立首次正确 ${report.independentCorrect} 题；提示支持首次正确 ${report.supportedCorrect} 题；重练恢复 ${report.retryRecovery} 题；未答 ${report.unansweredIds.length} 题。</p><p>${escapeHtml(report.nextSteps.join('；'))}</p></div>
        <div class="action-row">${report.wrongQuestionIds.length ? '<button id="retry-wrong" class="primary-button" type="button">只重练错题 🌱</button>' : ''}<button id="report-home" class="tool-button" type="button">返回课程首页</button><button id="report-restart" class="tool-button" type="button">重新开店</button></div>
        <details class="parent-panel"><summary>家长查看学习详情</summary><p>本报告区分无提示首次正确、看提示后首次正确和后续重练，不设置分数线或排名。</p>${Object.keys(report.misconceptions).length ? `<p><strong>典型错因：</strong>${Object.entries(report.misconceptions).map(([code, count]) => `${escapeHtml(reportMisconception(code))} ${count}次`).join('；')}</p>` : ''}<div class="table-wrap"><table><thead><tr><th>题目</th><th>第一次</th><th>首次提示</th><th>错因</th><th>重练</th></tr></thead><tbody>${state.records.map((record) => { const question = QUESTION_BANK.find((item) => item.id === record.questionId); return `<tr><td>${escapeHtml(question?.tags?.[0] || record.questionId)}<br>${escapeHtml(question?.expression || '')}</td><td>${record.firstCorrect ? (record.firstHintLevel ? '提示支持正确' : '独立正确') : '首次未正确'}</td><td>${record.firstHintLevel ? `${record.firstHintLevel}级` : '未看提示'}</td><td>${escapeHtml(reportMisconception(record.firstMisconception))}</td><td>${record.retry?.correct ? '✅ 重练正确' : '—'}</td></tr>`; }).join('')}</tbody></table></div></details>
      </section>`;
      document.getElementById('retry-wrong')?.addEventListener('click', () => {
        state.mode = 'retry'; state.retryQueue = [...report.wrongQuestionIds]; state.retryIndex = 0; state.screen = 'activity'; resetCurrent(); saveProgress(); renderCurrent();
      });
      document.getElementById('report-home').addEventListener('click', renderHome);
      document.getElementById('report-restart').addEventListener('click', openRestartDialog);
      focusHeading('report-heading'); announce('小小店长毕业啦，成长报告已经准备好。');
    }

    function openRestartDialog() {
      const trigger = document.activeElement;
      const backdrop = document.createElement('div');
      backdrop.className = 'dialog-backdrop'; backdrop.id = 'restart-dialog'; backdrop.setAttribute('role', 'dialog'); backdrop.setAttribute('aria-modal', 'true'); backdrop.setAttribute('aria-labelledby', 'restart-title');
      backdrop.innerHTML = `<div class="dialog-card"><h2 id="restart-title">要重新开始小小店长课程吗？</h2><p>这会清除第三单元的进度和成长报告，不会影响第一、第二单元。</p><div class="action-row"><button id="confirm-restart" class="primary-button" type="button">确定重新开始</button><button id="cancel-restart" class="tool-button" type="button">保留进度</button></div></div>`;
      document.body.appendChild(backdrop);
      const confirmButton = document.getElementById('confirm-restart');
      const cancelButton = document.getElementById('cancel-restart');
      const close = () => { backdrop.remove(); trigger?.focus?.(); };
      backdrop.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') { event.preventDefault(); close(); return; }
        if (event.key !== 'Tab') return;
        if (event.shiftKey && document.activeElement === confirmButton) {
          event.preventDefault(); cancelButton.focus();
        } else if (!event.shiftKey && document.activeElement === cancelButton) {
          event.preventDefault(); confirmButton.focus();
        }
      });
      confirmButton.addEventListener('click', () => { clearProgress(); state = createInitialState(); backdrop.remove(); renderHome(); });
      cancelButton.addEventListener('click', close);
      confirmButton.focus();
    }

    function focusHeading(id) {
      requestAnimationFrame(() => document.getElementById(id)?.focus({ preventScroll: true }));
    }

    function announce(text) {
      liveRegion.textContent = '';
      window.setTimeout(() => { liveRegion.textContent = text; }, 20);
    }

    function showToast(message) {
      document.querySelector('.toast')?.remove();
      const toast = document.createElement('div'); toast.className = 'toast'; toast.setAttribute('role', 'status'); toast.textContent = message; document.body.appendChild(toast);
      window.setTimeout(() => toast.remove(), 3200);
    }

    pauseButton.addEventListener('click', () => { saveProgress(); renderHome(); showToast('第三单元进度已经保存在这台设备上。'); });
    speechButton.addEventListener('click', () => {
      if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance((app.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 1000));
      utterance.lang = 'zh-CN'; utterance.rate = .9; window.speechSynthesis.speak(utterance);
    });
    if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') speechButton.hidden = true;

    Object.assign(window.MoneyMarketTestHooks, {
      getCurrentActivity: () => clone(currentActivity()),
      getCurrentQuestion: () => clone(currentQuestion()),
      getCurrentExploration: () => clone(currentExploration()),
      getState: () => clone(state),
      getReport: () => clone(buildReport(state.records, QUESTION_BANK)),
      clearProgress
    });

    renderHome();
  </script>
</body>
</html>
